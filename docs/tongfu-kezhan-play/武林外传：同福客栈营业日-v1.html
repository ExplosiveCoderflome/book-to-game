“洒一回扣你一文钱”。吕秀才抱着几本旧书踱到跟前，念了半句《论语》又咽回去，悄悄把书往柜台上推了推——那上头压着当票。莫小贝趴在桌上数铜板，数来数去还是那几个，忽然抬头问“嫂子，咱是不是要关门啦”。佟湘玉伸手把她的碎头发捋到耳后，笑了一下，说“关啥门，门一关，你上哪儿吃糖葫芦”。外头更夫敲过三更，她吹灭半截蜡烛，把最后几枚铜钱拢进匣子里，匣盖合上时“咔”的一声，轻得像一声叹气。","locations":[{"id":"loc_hall","title":"同福客栈正厅","text":"正厅里几张方桌摆得齐整，条凳挨着柜台。白展堂拿抹布把桌面擦得发亮，时不时瞟一眼门外街面；郭芙蓉搬着一摞碗筷从后厨出来，嚷嚷着后晌有街坊来问包桌的事。吕秀才把账本摊在柜台上，手指在算盘珠子上停住：“掌柜的，昨儿进的那批菜，钱还差着没结呢。”李大嘴从灶间探头，油手在围裙上蹭了两下：“今儿个的肘子火候好，要不要上个新价？”莫小贝趴在楼梯扶手边，插嘴说对门钱掌柜方才领着人往西街去了。佟湘玉把算盘拨得清脆，目光在几个人脸上转了一圈。","origin":"adapted","evidence":[]},{"id":"loc_kitchen","title":"同福客栈厨房","text":"灶台边热气裹着葱油味，李大嘴正把一块里脊肉拍得啪啪响，嘴里嚷着：“掌柜的，这肉再不腌就变色了，今儿是不是得多备些？”案板角上堆着半筐蔫了的青菜，郭芙蓉蹲在旁边择叶，抬头插嘴：“大嘴哥，你少买两斤肉，够我买十双布鞋了。”白展堂从门边探进半个脑袋，手里抖着一沓帖子：“对门钱掌柜今日又挂出特价菜牌，咱家要不要也动动价？”吕秀才抱着账本缩在米缸旁，笔尖悬着，等您发话。莫小贝踮脚偷捏一块炸丸子，被大嘴轻轻弹了下脑门。","origin":"adapted","evidence":[]},{"id":"loc_backyard","title":"同福客栈后院","text":"后院堆着半垛柴火，井台边的青石板被水桶磕出个豁口。白展堂靠在磨盘旁搓抹布，眼睛却往您这边瞟；郭芙蓉蹲在地上拿树枝划拉，嘴里念叨‘凭啥不让我去’。吕秀才捧着账本从廊下探出半个脑袋，嘴张了张又缩回去。李大嘴拎着条围裙从灶房后门探出身，油手在围裙上蹭了又蹭。莫小贝蹲在墙根逗蛐蛐，耳朵竖得老高。您刚在院里站定，郭芙蓉的树枝‘啪’地一折，白展堂乾咳一声，秀才的账本差点滑进井里。","origin":"adapted","evidence":[]},{"id":"loc_accounts","title":"同福客栈账房","text":"账房里墨味混着陈年纸张的潮气。吕秀才把算盘推到你面前，手指点着流水：“掌柜的，今日进项三十七文，可赊出去的菜钱有五十文，这账……轧不平啊。”郭芙蓉抱着抹布探进半个脑袋：“那啥，我今儿多擦了四张桌子，算不算工钱？”白展堂斜倚门框，捻着衣角犯嘀咕：“要不我去街口催催那几家欠账的？就怕碰见邢捕头，我这腿肚子先转筋。”李大嘴在窗外嚷：“明儿采买可不能再赊了，菜贩子脸都绿了！”莫小贝趴在案边，拿笔在废纸上画小人，忽然抬头：“嫂子，对门钱掌柜家今儿卖的包子比咱便宜两文！”你看着这一屋子人，算盘珠子还晃着。","origin":"adapted","evidence":[]},{"id":"loc_street","title":"七侠镇长街","text":"长街青石板被日头晒得发亮。钱掌柜在对面铺子门口摇扇子，冲你点头，笑得像抹了蜜。郭芙蓉扛着半扇猪肉从人群里挤过来，嘴里嚷：“掌柜的，肉铺老赵说再赊账就得现结！”话音没落，邢捕头带着燕小六踱到跟前，官靴磕出闷响：“佟掌柜，听说你们要办席？街面秩序可马虎不得。”白展堂凑近压低嗓子：“西街口来了个卖山货的，价压得极低，可东西瞧着不太鲜亮。”李大嘴从后厨探出脑袋，眼睛直往猪肉上瞄。你手里捏着昨日的账本，手心微微发汗——铺租、工钱、食材，哪一样都得从这条街上抠出来。","origin":"adapted","evidence":[]},{"id":"loc_qian_shop","title":"钱家对门","text":"钱家对门铺面半掩，钱掌柜倚着门框嗑瓜子，见你过来，瓜子壳往门槛里一撇。\n“哟，佟掌柜，今儿得空串门？”他拍拍手上碎屑，让开半步，却不全让。柜台后伙计正往红纸上写“特价酬宾”，墨迹未干；货架上码着成筐的鲜菜，看着比你家库房还满。\n“坐，坐。”他拎起茶壶又放下，“不过丑话说前头，这两天街坊可都往我这儿跑——你要是来打听菜价，我劝你省省脚力。”\n里间传来算盘声，脆得像故意打给你听。你瞧见墙角堆着没拆封的官面红封，他顺着你目光一挡：“那是给邢捕头备的年礼，没别的意思。”\n门口蒸笼冒白气，白展堂在斜对面假装扫地，耳朵支棱着。","origin":"adapted","evidence":[]}],"facts":[{"id":"f_ledger_balanced","label":"账本已轧平","description":"日结与流水能对上，可用于稳账路线结算。","kind":"event","initialValue":false,"playerKnown":true,"origin":"adapted","evidence":[]},{"id":"f_supplier_credit","label":"供货赊账","description":"供应商愿意短期赊账，缓解进货压力。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_qian_truce","label":"与钱掌柜暂时和解","description":"对门竞争暂时缓和，可换来合作或客源。","kind":"relationship","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_official_permit","label":"官面许可","description":"捕头默许或办理了宴席相关许可。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_charity_fair_done","label":"义卖办成","description":"街坊义卖实际落地，带来人情与名声。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_food_safety_incident","label":"食品安全隐患","description":"食材或操作出过问题，影响名声与冒险路线。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_long_guest_booked","label":"长住客落定","description":"有客人订下多日客房，带来稳定流水。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_staff_bonus_paid","label":"伙计加钱","description":"伙计拿到额外工钱，人心更稳。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_debt_due","label":"旧账到期","description":"供货或借款旧账进入催收阶段。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_charity_ready","label":"义卖筹备","description":"义卖方案已备好，待落地或结算。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_reputation_crisis","label":"名声风波","description":"街面出现对客栈不利的风声。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_qian_sabotage_known","label":"识破对门拆台","description":"玩家掌握钱掌柜暗中压价或散布消息的线索。","kind":"clue","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_secret_recipe_known","label":"私房菜谱","description":"李大嘴的私房菜谱被用于提升菜品。","kind":"item","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_low_price_policy","label":"低价菜单","description":"采用薄利多销的定价策略。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]},{"id":"f_high_price_policy","label":"高价菜单","description":"采用高价接待策略，风险与流水同时上升。","kind":"event","initialValue":false,"playerKnown":false,"origin":"adapted","evidence":[]}],"npcs":[{"id":"npc_bai","name":"白展堂","description":"跑堂，街面熟人多。","goal":"在不惹官面的前提下帮客栈拉客并保住工钱。","initialLocationId":"loc_hall","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_guo","name":"郭芙蓉","description":"杂役，力气大，想被认可。","goal":"证明自己能独当一面，换取掌柜信任。","initialLocationId":"loc_backyard","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_lv","name":"吕秀才","description":"账房，算账细但怕事。","goal":"把账做平，避免客栈因流水不清出事。","initialLocationId":"loc_accounts","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_li","name":"李大嘴","description":"厨子，爱买菜也爱研究菜谱。","goal":"控制厨房成本又保住手艺名声。","initialLocationId":"loc_kitchen","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_mo","name":"莫小贝","description":"小姑子，消息灵通。","goal":"从掌柜那里争取零花与玩耍空间，也想帮忙。","initialLocationId":"loc_backyard","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_qian","name":"钱掌柜","description":"对门竞争者。","goal":"抢客源、压同福客栈一头，必要时也可谈和。","initialLocationId":"loc_qian_shop","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_xing","name":"邢捕头","description":"街面捕头，讲官面也讲人情。","goal":"维持街面威风，顺便捞点面子和好处。","initialLocationId":"loc_street","knownFactIds":[],"origin":"adapted","evidence":[]},{"id":"npc_yan","name":"燕小六","description":"年轻捕快，听命巡逻。","goal":"跟着邢捕头办差，也想在街坊面前露脸。","initialLocationId":"loc_street","knownFactIds":[],"origin":"adapted","evidence":[]}],"actions":[{"id":"act_move_hall_kitchen","label":"去厨房","description":"你从正厅往厨房走，帘子一挑，油烟味扑面。李大嘴正掂着勺子，回头咧嘴：“掌柜的，食材可就这些了。”","locationId":"loc_hall","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_kitchen"}],"text":"你掀帘进了厨房，灶火正旺，李大嘴把锅往边上一挪，指着案板上的菜筐：“掌柜的，存货不多了，今儿个要不要添点？”你扫了一眼库存，心里盘算着这一趟能不能省着点用。","origin":"adapted","evidence":[]},{"id":"act_move_hall_backyard","label":"去后院","description":"你绕过正厅的桌子，往后院走，手里还攥着半截没写完的菜单。","locationId":"loc_hall","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_backyard"}],"text":"后院里，李大嘴正蹲在菜筐前翻拣蔫了的青菜，郭芙蓉拎着水桶从井边过来，白展堂斜倚在门框上擦汗。莫小贝从柴堆后探出头喊饿。你扫了一眼，面粉袋快见底了，客房被褥还堆在廊下没晒。展堂凑过来低声说对门钱掌柜刚买走两条街的便宜鸡蛋。你心里盘算：得开口分派活儿，又得防着伙计们因为工钱和采买生出闲话。","origin":"adapted","evidence":[]},{"id":"act_move_hall_accounts","label":"去账房","description":"正厅里李大嘴正跟白展堂为菜钱拌嘴，郭芙蓉端着一摞碗挤过去。佟湘玉把抹布往肩上一搭，转身往账房走——吕秀才那儿的算盘声早等着了。","locationId":"loc_hall","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_accounts"}],"text":"佟湘玉掀帘进了账房，吕秀才忙把摊开的账本推过来，指着几行数目小声说对不上。她坐下时凳子腿吱呀一响，正厅那头白展堂拔高了声喊“掌柜的——”，她应声说一会儿过去。算盘珠子一拨，明面上的流水和库存先对上了，只是有两笔赊账还挂在半空，她心里记下，没急着拍板。","origin":"adapted","evidence":[]},{"id":"act_move_hall_street","label":"去长街","description":"你从柜台后站起身，把账本往袖里一揣，朝门口走去。白展堂正擦着桌子，抬头问：“掌柜的，上街？”你点点头，心里盘算着长街上的菜价和客流。","locationId":"loc_hall","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_street"}],"text":"你跨出同福客栈的门槛，长街上叫卖声扑面而来。菜贩的担子挤在路旁，几个脚夫蹲在墙根歇脚。你瞧见对门钱掌柜正跟一个供货商低声说话，眼睛还往你这边瞟了一下。街角燕小六挎着刀巡逻，见你出来咧嘴一笑。你走过两个菜摊，问了问白菜和猪肉的行情，心里默记下价钱。回身时，白展堂已经跟出来，凑近低声说：“掌柜的，钱掌柜刚才看您那眼神，不太对劲。”你摆摆手，心里却留了个神。","origin":"adapted","evidence":[]},{"id":"act_move_street_hall","label":"回正厅","description":"你从长街折回同福客栈门口，门帘一掀，正厅的灯火与菜香扑面而来。白展堂在柜台边抬眼招呼，账本上的算珠声隐约可闻。","locationId":"loc_street","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_hall"}],"text":"你踏进正厅，把街面上的嘈杂关在门外。白展堂递过抹布模样的笑：“掌柜的回店了？”郭芙蓉从后厨探头张望，吕秀才把账本往前推了半寸，等你发落下一档子营生。","origin":"adapted","evidence":[]},{"id":"act_move_street_qian","label":"去钱家对门","description":"你决定「去钱家对门」。表现掌柜去对门探价或交涉。店里人声嘈杂，算盘与锅铲声交错，佟湘玉把袖口一挽，心里先把银钱、客情和伙计的脸色掂量了一遍。","locationId":"loc_street","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_qian_shop"}],"text":"你做完「去钱家对门」这一档。伙计们盯着你的脸色，街面风声还在窗外转，账本上的数字和名声都仿佛跟着动了一动。同福客栈这一刻的气氛，全系在你掌柜的决断上。","origin":"adapted","evidence":[]},{"id":"act_move_qian_street","label":"离开钱家对门","description":"佟湘玉把手里的帕子一拢，冲钱家对门那扇半掩的木门又欠了欠身，嘴上道着“改日再来叨扰”，脚下却已经往台阶下挪。门槛外头两个钱家伙计还在嗑瓜子，见她出来，一个忙把瓜子壳扫开，一个嘿嘿笑着喊“佟掌柜慢走”，她也不恼，回头抛下一句：“慢不走，还得赶回去给客人上菜呢——你们家那账，我可记着嘞。”说罢扶着门框下了最后一级台阶，日头正好斜过街心的老槐树，把她影子拉得老长，帕子一甩，脚步轻快得像是捡了钱又像是躲了债。","locationId":"loc_qian_shop","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_street"}],"text":"佟湘玉离开钱家对门，回到街面上。身后钱家伙计的笑声渐渐远了，街心那棵老槐树的影子铺在青石板上。她理了理衣裳，盘算着方才那番交涉的得失，心里有了底，脚下便往同福客栈的方向去，途中还顺手接了张卖炊饼的递来的热饼。","origin":"adapted","evidence":[]},{"id":"act_move_kitchen_hall","label":"端菜回正厅","description":"佟湘玉一手托盘、一手掀起厨房的棉布门帘，热气先她一步扑进正厅，熏得靠门那桌的客人直眯眼。她脚下迈得又快又稳，嘴里还不忘招呼：“来喽来喽——红烧狮子头，谁的？别伸筷子抢啊，烫着嘴我可不赔医药费。”白展堂正给角落那桌斟茶，见状一个箭步蹿过来要接盘子，被佟湘玉用胳膊肘轻轻一顶：“去去去，你那手刚数完铜钱，油乎乎的，别糟蹋我的菜。”郭芙蓉在后头跟着端了一碟凉拌黄瓜，走路带风，差点撞上条凳，被佟湘玉回头一句“芙儿，稳当点儿，盘子碎了从你月钱里扣”给钉在原地。菜稳稳落在桌上，客人拍手叫好，佟湘玉抹了把额角的汗，笑得眼睛都弯了，转身又朝厨房喊：“莫小贝！汤别偷喝，端出来！”","locationId":"loc_kitchen","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"move","locationId":"loc_hall"}],"text":"你稳稳当当地把热菜从厨房端进了正厅，一路没洒半滴汤汁，客人们闻着香味纷纷叫好，有几桌还追着问这道菜叫什么名儿。白展堂凑过来低声夸了句“掌柜的手艺就是稳”，郭芙蓉也老实把凉菜摆正了。厨房那边莫小贝应了一声，汤锅的香气跟着飘了出来。这一趟跑得利索，正厅的气氛热络了不少。","origin":"adapted","evidence":[]},{"id":"act_move_backyard_hall","label":"回正厅招呼","description":"你决定「回正厅招呼」。表现掌柜歇完继续营业。店里人声嘈杂，算盘与锅铲声交错，佟湘玉把袖口一挽，心里先把银钱、客情和伙计的脸色掂量了一遍。","locationI 成八瓣儿。”","locationId":"loc_backyard","npcId":"npc_guo","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"stamina","delta":1}],"text":"郭芙蓉把活揽得满当当，围裙系紧、袖子挽高，端水洗碗一通忙活；虽偶尔毛手毛脚，却真替佟湘玉分担了不少杂事，客栈里多了几分热闹气。","origin":"adapted","evidence":[]},{"id":"act_talk_lv","label":"听吕秀才报账","description":"你决定「听吕秀才报账」。表现吕秀才拿着账本吞吞吐吐。店里人声嘈杂，算盘与锅铲声交错，佟湘玉把袖口一挽，心里先把银钱、客情和伙计的脸色掂量了一遍。","locationId":"loc_accounts","npcId":"npc_lv","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"reveal","factId":"f_debt_due"}],"text":"你做完「听吕秀才报账」这一档。伙计们盯着你的脸色，街面风声还在窗外转，账本上的数字和名声都仿佛跟着动了一动。同福客栈这一刻的气氛，全系在你掌柜的决断上。","origin":"adapted","evidence":[]},{"id":"act_talk_li","label":"问李大嘴菜价","description":"你决定「问李大嘴菜价」。表现李大嘴一边切菜一边吹菜谱。店里人声嘈杂，算盘与锅铲声交错，佟湘玉把袖口一挽，心里先把银钱、客情和伙计的脸色掂量了一遍。","locationId":"loc_kitchen","npcId":"npc_li","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"stock","delta":1}],"text":"你做完「问李大嘴菜价」这一档。伙计们盯着你的脸色，街面风声还在窗外转，账本上的数字和名声都仿佛跟着动了一动。同福客栈这一刻的气氛，全系在你掌柜的决断上。","origin":"adapted","evidence":[]},{"id":"act_talk_qian","label":"与钱掌柜搭话","description":"你决定「与钱掌柜搭话」。表现钱掌柜皮笑肉不笑地比价。店里人声嘈杂，算盘与锅铲声交错，佟湘玉把袖口一挽，心里先把银钱、客情和伙计的脸色掂量了一遍。","locationId":"loc_qian_shop","npcId":"npc_qian","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"可能被套话。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":1},{"kind":"resource","resourceId":"reputation","delta":-1}],"text":"你做完「与钱掌柜搭话」这一档。伙计们盯着你的脸色，街面风声还在窗外转，账本上的数字和名声都仿佛跟着动了一动。同福客栈这一刻的气氛，全系在你掌柜的决断上。","origin":"adapted","evidence":[]},{"id":"act_talk_xing","label":"给邢捕头见礼","description":"佟湘玉把抹布往肩上一搭，赶三步迎到门边，福身道：“邢捕头大驾光临，同福客栈蓬荜生辉。”邢捕头偏不急着进门，先拿靴尖在门槛上蹭了蹭，才把腰刀往前提半寸，下巴一抬：“嗯——本捕头巡街至此，顺道看看你们这儿的治安。”燕小六紧跟在后，先“哐”地敲一下腰锣，又挺胸帮腔：“听见没有？顺道！我们捕头顺道都这么威风！”说着还伸手去扶邢捕头的刀鞘，差点把自己绊个趔趄。佟湘玉忍着笑，忙让白展堂沏茶，又把瓜子碟往桌心推了推：“那是那是，二位辛苦，先坐先坐。”","locationId":"loc_street","npcId":"npc_xing","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"可能被要求孝敬。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"silver","delta":-1}],"text":"邢捕头受了礼，威风更足，坐下后先把茶碗盖刮得叮当响，又指点墙上价目牌说字号太小；燕小六在旁连连点头，顺手把瓜子嗑得满地壳。佟湘玉陪笑应承，心里已拨起算盘：这二位坐得越久，茶水和瓜子越费，得寻个由头把话头引到正事上。","origin":"adapted","evidence":[]},{"id":"act_talk_mo","label":"听莫小贝说闲话","description":"莫小贝蹲在柜台边的长凳上，把一只旧毽子踢得啪啪响，羽毛掉了一地也不管，嘴里却一刻不停：“嫂子嫂子，你猜怎么着？西街王屠户家那头花猪昨儿拱开了栅栏，一路拱到钱掌柜的绸缎庄门口，把晾着的红布拱成了个花卷儿！”说着她把毽子往上一挑，毽子没接住，反手砸在算盘上，珠子噼里啪啦乱跳。她也不捡，索性盘腿坐好，掰着手指头往下数：“还有啊，李大嘴他二舅从南边回来了，说那边新开了家酒楼，招牌菜叫‘一掌定乾坤’，其实就是猪蹄子，卖得比咱同福客栈的八宝鸭还贵！郭芙蓉听了直撇嘴，说那肯定是糊弄人。”她忽地压低嗓门，凑到你面前，眼睛亮晶晶的：“最要紧的是，镇上要办庙会了，说要摆十丈长的糖人摊子——嫂子，咱客栈门口那块空地，不摆个摊儿可惜了吧？我保证只看摊儿不偷吃，就尝一小口。”说完自己先乐了，抓起毽子又踢，脚尖一歪，正踢翻了柜上那碟瓜子壳。","locationId":"loc_backyard","npcId":"npc_mo","availableWhen":[],"requires":[],"blockedReason":"无。","risk":"无。","timeCost":1,"once":false,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"stamina","delta":-1}],"text":"莫小贝一边踢毽子一边把镇上的新鲜事倒豆子似的全抖了出来：王屠户家的花猪拱了钱掌柜的绸缎，南边新酒楼的贵价猪蹄，还有即将开办的庙会。她踢翻瓜子壳后吐了吐舌头，倒也没忘了正经事——顺嘴提了句庙会上摆摊的生意经。你听罢心里有了盘算：庙会人多，同福客栈若在门口支个摊子，卖点热乎小吃或是凉茶，兴许能添一笔进项。只是这小祖宗“只看摊不偷吃”的保证，实在不太牢靠，得先想好怎么拴住她。","origin":"adapted","evidence":[]}],"events":[{"id":"ev_noon_pressure","label":"午间客流上来了","when":[{"kind":"time","atLeast":15}],"effects":[{"kind":"resource","resourceId":"stamina","delta":-2}],"text":"午时刚过，门口人流像赶集，长凳还没擦净就坐满。白展堂端着两盘溜肥肠从人缝里钻，鞋底一滑，硬是把菜举过头顶转半圈；郭芙蓉拍桌催账，莫小贝趁乱摸走一碟花生米，李大嘴在灶前扯嗓门喊火不够旺。佟湘玉左手算盘右手抹布，楼上楼下跑得鬓角冒汗，刚给这桌添完茶，那桌又喊结账，腿肚子直打颤，嗓子也快冒烟。","visibility":"public"},{"id":"ev_evening_rumor","label":"街面起风声","when":[{"kind":"time","atLeast":30}],"effects":[{"kind":"set","factId":"f_reputation_crisis","value":true}],"text":"掌灯时分，同福客栈门口那盏破灯笼刚点上，街对面卖豆腐脑的王婆就端着碗凑到门槛边，压低嗓子跟郭芙蓉说：“听说你们家后厨昨儿夜里闹鬼，一锅汤自己咕嘟咕嘟冒泡，把个客人吓得连鞋都跑丢了一只。”郭芙蓉正蹲着擦桌子，抹布一甩站起来：“哪儿的事！那是李大嘴打呼噜，灶膛里的火没封好！”话音没落，李大嘴举着半根黄瓜从后院冲出来，非要跟王婆当面对质，结果一脚踩翻泔水桶。白展堂赶紧一手拎一个往后拽，嘴里还念叨“江湖险恶、流言更险恶”，顺手把王婆碗里最后一勺豆腐脑倒进自己嘴里。莫小贝趴在柜台上笑得笔都拿不稳，吕秀才憋着笑给客人赔不是。佟湘玉站在楼梯口，算盘珠子一拨，心说这谣言再传两日，明儿房钱怕是要跌三文，得赶紧想个辙把名声捞回来。","visibility":"public"},{"id":"ev_debt_notice","label":"旧账来催","when":[{"kind":"time","atLeast":45}],"effects":[{"kind":"set","factId":"f_debt_due","value":true}],"text":"天刚擦亮，同福客栈的门板还没全卸下来，街口就晃来一个人影——穿灰布短褂、腋下夹着个油纸包的算盘，是万利钱庄跑腿的小六子，人未到声先到：「佟掌柜，今儿可是二十三，上月的利钱该清一清喽！」佟湘玉手里的抹布在半空顿住，随即往肩上一搭，笑得比门口的灯笼还圆：「哎哟六子兄弟，来得早不如来得巧，先坐下喝碗热茶嘛，茶叶是秀才昨儿新买的……」话没落地，白展堂已经从柜台后头溜到楼梯拐角，脚尖都朝后门歪了；李大嘴举着锅铲从灶房探出半个身子，一副要讲理又怕挨揍的模样；郭芙蓉袖子一撸就要上前，被吕秀才死死拽住衣角，一边低声念叨「打不得打不得，打了要赔药钱，药钱也是钱」。小六子把算盘往桌上一搁，珠子哗啦一响，笑得比谁都客气：「茶就不喝了，掌柜的，账本拿来，咱一笔一笔对着念，念完了我回去好交差。」","visibility":"hidden"},{"id":"ev_final_bell","label":"日头偏西","when":[{"kind":"time","atLeast":65}],"effects":[{"kind":"resource","resourceId":"stamina","delta":-1}],"text":"后院里那口老铜铃被风一拨，叮当响了三声，佟湘玉手里那把算盘珠子就卡在半空没落下去——天字号这账还没轧平，日头倒先贴到西墙根了。她抬眼一瞧：白展堂正猫着腰从前堂溜回来，鞋底还沾着两片不知哪家酒席蹭来的花生皮，嘴上说着「掌柜的我这就去关大门」，脚却先拐进厨房想摸块酥饼；李大嘴攥着锅铲从灶间探出半个脑袋，油光满面地嚷「最后一道糖醋排骨要不要上」，被郭芙蓉一巴掌拍回去，排山倒海的气势带翻了半筐蒜，滚得满地乱窜。吕秀才捧着账本缩在柜台后头，一根指头点着算珠念念有词，被莫小贝从背后抽走了笔杆子当剑耍，急得直喊「子曾经曰过」。外头街上的梆子已经敲过二更，邢捕头提着灯笼晃过去，隔着门缝喊一嗓子「同福的，赶紧收摊儿，明儿个还开不开门啦」。佟湘玉把算盘往柜上一拍，心里那杆秤掂量得清清楚楚：今儿个这摊子事儿，是先去把那两桌赊账的客人堵在门口，还是先把小贝手里的笔抢回来、把灶上的火压下去——路只剩这一条，得挑了，再磨蹭，连灯笼都省得点了。","visibility":"public"}],"endings":[{"id":"ending_steady_profit","title":"账平钱稳，同福有底","text":"佟湘玉把算盘往柜台上一合，珠子“哗啦”一声脆响，震得油灯的火苗都歪了歪。她眯眼瞧着账本上最后一行数字，嘴角先是一抽，随即又慢慢翘起来——不多不少，账平了；后厨米缸里有底，柴房垛着柴，伙计们的月钱也都在小匣子里码得齐齐整整。白展堂正蹲在门槛上擦他那块“盗圣”玉佩，擦两下就抬头瞄一眼门外，嘴里念叨“今儿没闲人踩点吧”；郭芙蓉端着一摞碗从后院冲出来，险些撞翻醋坛子，被佟湘玉一嗓子“慢着些个”喝住，吐了吐舌头。吕秀才在账台边上摇头晃脑背他的子曰，李大嘴从厨房探出半个脑袋问晚上还加不加个菜，莫小贝趴在桌上偷吃花生米，被逮个正着。佟湘玉伸手把花生碟子挪开，又拿指节敲了敲桌面：“都听好喽——咱同福不算大富大贵，可流水稳、货架满、人心齐，这日子就能热热闹闹往下过。谁要敢偷懒耍滑，莫怪我算盘珠子不认人。”伙计们齐声应了，笑声混着锅气从堂里漫出去，直飘到七侠镇的石板街上。","when":[{"kind":"fact","factId":"f_ledger_balanced","value":true},{"kind":"resource","resourceId":"silver","atLeast":60},{"kind":"resource","resourceId":"reputation","atLeast":45},{"kind":"resource","resourceId":"favor","atLeast":40},{"kind":"time","atLeast":50}],"kind":"ending"},{"id":"ending_goodwill_network","title":"人情铺路，客源不断","text":"腊月二十三，同福客栈门口支起三口大锅，佟湘玉挽着袖子亲自掌勺，把义卖剩下的半扇猪肉炖得满街飘香。郭芙蓉抡着大勺挨个给排队的街坊添汤，嘴里还吆喝“别挤别挤，人人有份”，白展堂在柜台后头飞快拨着算盘，算到第三遍自己都乐了——赔进去的银子够买两头猪，可门口那队伍从巷口一直排到对门钱庄。对面钱掌柜端着一碗汤，咂巴着嘴冲佟湘玉竖大拇指：“佟掌柜，上回你那句‘和气生财’，我琢磨了半个月，服了。”李大嘴从后厨探出头来喊：“掌柜的，莫小贝又把饺子馅偷吃了一半！”佟湘玉把勺子往锅沿一磕，笑道：“让她吃，吃完了叫她给客人们唱段莲花落抵账。”街坊们哄笑起来，几个老主顾当场拍下银子订了年夜饭，说别家馆子冷锅冷灶，就这儿有人情味儿。佟湘玉擦擦汗，望着一屋子热气腾腾的脸，心里那本账翻来覆去——银子没多赚几两，可这满堂的笑声和招呼声，比什么招牌都硬气，来年这条街上的生意，怕是都要先来同福客栈问一声好。","when":[{"kind":"resource","resourceId":"favor","atLeast":65},{"kind":"resource","resourceId":"reputation","atLeast":55},{"kind":"fact","factId":"f_qian_truce","value":true},{"kind":"fact","factId":"f_charity_fair_done","value":true},{"kind":"resource","resourceId":"silver","atLeast":40},{"kind":"time","atLeast":55}],"kind":"ending"},{"id":"ending_risky_banquet","title":"大单落定，险中得利","text":"送走最后一拨官面客人，佟湘玉把门板一合，转身就瘫在长凳上，鞋都懒得脱。李大嘴从后厨探出半张脸，围裙上糊着三色酱汁，手里还攥着把豁了口的锅铲，说掌柜的，八个凉菜二十个热菜，我一个人颠勺颠得胳膊都不是自己的了。白展堂抱着抹布从楼上溜下来，一边擦桌子一边小声报账：那桌穿绸子的老爷赏了二两，还说味道正。郭芙蓉把桌底下的碎瓷片扫成一堆，嘴硬说自己只摔了三只碗，吕秀才在旁边伸四根手指头，被她一巴掌拍回去。莫小贝早趴在柜台上睡着了，怀里还抱着那把没数完的算盘。佟湘玉撑起身子，把银票一张张抹平，就着油灯照了又照，嘴里骂骂咧咧：这买卖险得像走钢丝，下回再接这种活儿，我先把你们几个的腿绑上。骂完了，眼睛却亮得跟灯芯似的，把银票齐齐码进匣子，又重重拍了两下。","when":[{"kind":"fact","factId":"f_official_permit","value":true},{"kind":"resource","resourceId":"silver","atLeast":85},{"kind":"resource","resourceId":"reputation","atLeast":45},{"kind":"fact","factId":"f_food_safety_incident","value":false},{"kind":"time","atLeast":55}],"kind":"ending"},{"id":"ending_debt_failure","title":"银钱见底，账期压垮","text":"最后一颗算盘珠子被佟湘玉拨到梁上，又“啪”地弹回来，滚进郭芙蓉的鞋帮里。账本摊在柜台上，墨迹还没干，银钱却已见了底：柜屉里只剩三枚铜板和一根断了半截的簪子。门外，卖酱菜的孙掌柜抱着空坛子坐了门槛，钱庄的伙计把借据举得比招幌还高，嘴里嚷嚷“今日不见银子，明日就搬桌椅”。白展堂忙赔笑给众人添茶，袖子一抖，茶壶盖飞进孙掌柜怀里；莫小贝蹲在墙角数铜板，数来数去只够买半串糖葫芦，急得直跺脚。吕秀才举着毛笔要写“缓期三日”，被债主一把夺过，糊在自己额头上。佟湘玉深吸一口气，把算盘端正摆好，笑得比哭还端庄：“各位乡邻，账是赖不掉的，同福客栈今日先关张，欠的银子，咱一笔一笔还！”话音落下，门口一阵唏嘘，风卷着落叶从空灶台边吹过，锅是冷的，人心倒还没散。","when":[{"kind":"resource","resourceId":"silver","atMost":0}],"kind":"failure"},{"id":"ending_reputation_failure","title":"名声塌了，客不再来","text":"街口卖豆腐脑的赵大爷如今见了我都改道走，说是怕沾上晦气——同福客栈的名声，就这么一条街一条街地臭出去了。头三天还有人不信邪进来坐坐，点一壶茶，眼睛却一直往我脸上瞟，好像我佟湘玉能当场从袖子里掏出一把刀来；到第五天，午饭的点儿，大堂里八张桌子擦得锃亮，亮得能照见人，偏偏就是照不见客人。白展堂蹲在门槛上嗑瓜子，嗑一颗往街对面看一眼，半包瓜子嗑完了才憋出一句：“掌柜的，要不咱把招牌翻过来挂？”郭芙蓉把抹布甩在他后脑勺上，骂他没出息，转身自己却把“同福客栈”那块木牌擦了三遍，擦得字都发白了。李大嘴在后厨炖了一锅又一锅，说菜凉了不好吃，硬是热了七回，最后自己蹲在灶台边吃，吃得直打嗝。莫小贝抱着她的糖葫芦蹲在楼梯口数蚂蚁，数到第十七只，抬头问我：“嫂子，咱家是不是要关门了？”我伸手把她脑袋按进怀里，笑着说别瞎说，可低头一瞧那本账，昨日进项四文钱，还是隔壁王婆看我可怜硬塞的。这名声啊，比锅底灰还黏人，抹一把，手上更黑。","when":[{"kind":"resource","resourceId":"reputation","atMost":10}],"kind":"failure"},{"id":"ending_exhausted_failure","title":"掌柜累倒，营业停摆","text":"佟湘玉把最后一本账册往柜台上一摊，算盘珠子还捏在指头缝里，嘴里念叨着“再核一笔，就一笔”，眼皮已经沉得像挂了俩秤砣。白展堂端着醒酒汤过来，见她脑袋一点一点，忙喊：“掌柜的，您先歇会儿！”佟湘玉偏不，手一推账本，硬撑着笑：“歇啥歇，咱同福客栈的招牌不能倒——”话没说完，眼前一黑，整个人顺着柜台边软下去，算盘“哗啦”砸了一地，珠子滴溜溜滚到郭芙蓉脚边。郭芙蓉吓得排山倒海都忘了使，蹲下去扶人；莫小贝抱着糖葫芦站在门槛上，嘴一瘪就哭；李大嘴从灶房探出半个脑袋，围裙上还沾着面，慌得把锅铲当成了勺子。白展堂一边掐人中一边嚷：“别围着，散开点，通风！”吕秀才手忙脚乱翻药箱，翻出半包陈皮又塞回去。账册摊在油灯底下，最后那笔数只写了一半，墨迹还湿着。人这一倒，满堂的凳子都像没了主心骨，菜单写得再花哨、街坊人情再热乎，这会子也接不上茬了。","when":[{"kind":"resource","resourceId":"stamina","atMost":0}],"kind":"failure"},{"id":"ending_timeout","title":"日头落尽，账期已到","text":"日头一落，七侠镇的灯笼便一盏接一盏地亮起来，街口卖糖炒栗子的老周收了锅，还隔着半条街冲同福客栈喊了一嗓子：“佟掌柜，今儿个的账，明儿再算咧！”佟湘玉正扒在柜台后头拨算盘，珠子拨得噼里啪啦，偏生那笔进货的银子还对不上，急得她把账本翻得哗哗响。白展堂端着一盆水从后厨出来，脚下一滑，水泼了半地，郭芙蓉举着抹布追着要擦，反把算盘珠子扫落了三颗，滚到门槛边打转。莫小贝蹲在灶台前数铜板，数到一半被李大嘴塞了个刚出锅的糖三角，烫得直甩手，铜板撒了一地。佟湘玉扶额长叹一声，把那半本没理清的账合上，抬眼望见门外灯笼影子里客人散尽的空桌，忽而笑了：“罢了罢了，今日这账，留到明儿个再跟你们一个个算。”众人齐齐应了声，收拾板凳的收拾板凳，扫地出门的扫地出门，同福客栈的灯火便这么晃晃悠悠地，落进了下一回的夜里。","when":[{"kind":"time","atLeast":72}],"kind":"timeout"}],"resources":{"silver":35,"stamina":70,"reputation":45,"favor":40,"stock":12},"resourceDefs":{"silver":{"label":"银钱","unit":"两","min":-10,"max":200,"initial":35,"display":"bar","warnAtMost":5,"onMin":{"ending":"ending_debt_failure"},"description":"日常流水、进货与工钱都靠它。"},"stamina":{"label":"体力","unit":"点","min":0,"max":100,"initial":70,"display":"bar","warnAtMost":15,"onMin":{"ending":"ending_exhausted_failure"},"description":"掌柜亲自操劳会消耗，歇脚可恢复。"},"reputation":{"label":"名声","unit":"点","min":0,"max":100,"initial":45,"display":"bar","warnAtMost":10,"onMin":{"ending":"ending_reputation_failure"},"description":"影响客源与官面观感。"},"favor":{"label":"人情","unit":"点","min":0,"max":100,"initial":40,"display":"bar","description":"伙计、街坊与对门的信任。"},"stock":{"label":"库存","unit":"份","min":0,"max":50,"initial":12,"display":"number","description":"可售菜品与客房用品的基础库存。"}},"production":{"complete":true,"tier":"S"},"storylets":[{"id":"m1_morning_market","title":"清晨进货","kind":"main","locationIds":["loc_street"],"text":"长街早市，天刚蒙蒙亮。佟湘玉挎着竹篮在菜摊前停下，指尖掐了掐白菜帮子，又翻看旁边筐里的萝卜。小贩赔着笑：“佟掌柜，您眼力毒，这批可是今早刚拔的。”她没接话，心里默算：库里剩十二份，今日至少卖二十来份才够本。白展堂凑近低声道：“对门钱掌柜刚过去，把东头那筐鲜菇全包了。”远处郭芙蓉正跟鱼贩比划，李大嘴在肉案前拎起一块五花肉对着日头照。三个伙计都等着她拿主意，日头一点点升高，街面人声渐稠。","choices":[{"id":"c_bargain","label":"压价买粗菜","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":8}],"effects":[{"kind":"resource","resourceId":"silver","delta":-8},{"kind":"resource","resourceId":"stock","delta":6},{"kind":"resource","resourceId":"stamina","delta":-2}],"text":"佟湘玉挑了挑白菜，用指节敲了敲萝卜，跟小贩你来我往磨了半天，硬是压下一截价。小贩嘴上嘟囔“佟掌柜您真会过日子”，手里麻利地装筐。省下的几文是省下了，可筐里的菜成色参差，外头几棵白菜叶子还带了虫眼。她掂了掂菜篮子，朝李大嘴招呼一声：“粗菜细作，今儿个就看你的手艺了。”李大嘴接过筐，咧嘴道：“掌柜的放心，没虫眼的我还做不出味儿呢。”白展堂在旁边摇头笑，心里明白今日菜单上怕是要多几道素菜。"},{"id":"c_premium","label":"买好食材","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":14}],"effects":[{"kind":"resource","resourceId":"silver","delta":-14},{"kind":"resource","resourceId":"stock","delta":10},{"kind":"resource","resourceId":"reputation","delta":1}],"text":"佟湘玉在肉案前停住，指了指那块纹理齐整的五花肉，又让郭芙蓉把鲜菇和两尾活鱼装进篮里。小贩报的价比往常高出两成，她咬了咬后槽牙，还是数了铜板过去。郭芙蓉抱着鱼篓直乐：“掌柜的今儿大气！”李大嘴凑过来看食材，眼睛都亮了：“这肉好，这鱼活，中午我给您露一手。”白展堂在旁边掂了掂剩下的钱袋子，低声提醒：“咱这手一松，后头几天可得精打细算。”佟湘玉把篮子往他手里一塞：“先把菜送回去，别在这杵着。”贵是贵了些，可这筐菜往灶上一摆，菜单确实体面不少。"},{"id":"c_skip","label":"今日少进","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":1},{"kind":"resource","resourceId":"favor","delta":-1}],"text":"佟湘玉在菜摊前转了一圈，把竹篮往胳膊肘上一挂，冲小贩摆摆手：“今儿个先少拿些，库里还有剩的。”小贩手里正挑拣的青菜停在半空，脸色讪讪：“佟掌柜，您这好几天没照顾我生意了。”她笑着打了两句圆场，拉着郭芙蓉往回走。郭芙蓉回头看了一眼那筐水灵的青菜，忍不住小声问：“掌柜的，真不进了？万一中午来客……”佟湘玉没接话，脚步却比来时慢了些。白展堂路过，把这一幕看在眼里，什么也没说，只是顺手帮小贩把散落的菜叶拢了拢。省下力气是省下了，可卖菜的脸色，她瞧得真真切切。"}]},{"id":"m2_pricing_board","title":"定价牌前","kind":"main","locationIds":["loc_hall"],"text":"同福客栈正厅，晌午刚过。白展堂用抹布擦着水牌，回头瞅你：“掌柜的，这牌上的价，改不改？”郭芙蓉搬着一筐碗从灶房出来，插嘴：“街口卖馄饨的老刘都降价了，咱要不也——”吕秀才在柜台后把算盘拨得噼啪响，声音发虚：“可账上这个月菜钱已经超了。”李大嘴从灶房探出半张脸，手里还攥着勺：“菜价降了，我这用料也得减，不然亏的全是厨房的油水。”水牌上的字被水汽洇得模糊，一撇一捺都像在催你落笔。","choices":[{"id":"c_low_price","label":"薄利多销","timeCost":1,"effects":[{"kind":"set","factId":"f_low_price_policy","value":true},{"kind":"resource","resourceId":"reputation","delta":3},{"kind":"resource","resourceId":"silver","delta":-2}],"text":"你让郭芙蓉把水牌上的菜价一道道压低，白展堂在旁边念新价，念到第三遍就有人探头来问。街坊传话快，没半个时辰，门口便多了几个熟面孔。吕秀才攥着账本小声提醒：“利薄了，得多翻台。”你点头，心里把翻台数记上。李大嘴嘟囔着往回走：“菜量可不带再缩的。”水牌上墨迹湿亮，外头日头正晒。"},{"id":"c_standard_price","label":"照常定价","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":1},{"kind":"resource","resourceId":"silver","delta":1}],"text":"你按住水牌没动，只说照旧。白展堂把抹布叠成方块，顺手擦了擦边角：“稳妥。”郭芙蓉有点泄气，但也没顶嘴，抱着筐又往回走。吕秀才把账本合上，松了口气：“不动价，进出好算。”李大嘴从灶房窗口递出一碟试味的炒蛋，让你尝咸淡。门外客人照常进来，没人多问价，也没人特别热络，流水一分一分地走。"},{"id":"c_high_price","label":"高价试水","timeCost":1,"effects":[{"kind":"set","factId":"f_high_price_policy","value":true},{"kind":"resource","resourceId":"silver","delta":8},{"kind":"resource","resourceId":"reputation","delta":-3}],"text":"你提笔把招牌菜的价往上加了一截。白展堂念出来时声音顿了一顿，郭芙蓉眼睛都睁圆了。不多时，街上就有人议论同福客栈“阔气了”。吕秀才小声报出预估进账，又添一句：“可别都光看不吃。”果然，头几桌客人翻了翻菜单，只点了最便宜的。钱掌柜在对门站着，往这边望了好几眼，嘴角似笑非笑。银子是进了几两，水牌前的空气却有点凉。"}]},{"id":"m3_noon_rush","title":"午间客流","kind":"main","locationIds":["loc_hall"],"text":"午时刚过，正厅八张桌子全坐满了。白展堂端着两盘菜在人群里侧身挤过，嘴里喊着“借光借光，油溅了衣裳可别怪我”。郭芙蓉拎着茶壶从后厨冲出来，辫梢都汗湿了：“掌柜的，三号桌催第三回了！”李大嘴从灶房探出半个脑袋：“菜不够了，肉还剩一份，鸡蛋也没了！”吕秀才抱着账本站在柜台边，小声提醒：“今儿流水还没过十两，可外头还有等座的。”你抬眼一瞧，门口站着个穿绸衫的胖子，手里捏着碎银，正不耐烦地拿扇子敲掌心。另一边，靠窗的老街坊已经喝了两壶茶，桌上一碟花生米见了底。后厨的风箱呼哧呼哧响，跑堂的脚步声踩得楼板直颤。","choices":[{"id":"c_help_serve","label":"亲自救场","timeCost":2,"requires":[{"kind":"resource","resourceId":"stamina","atLeast":8}],"effects":[{"kind":"resource","resourceId":"stamina","delta":-6},{"kind":"resource","resourceId":"silver","delta":10},{"kind":"resource","resourceId":"favor","delta":2}],"text":"你把袖子一挽，抄起托盘亲自往人堆里送。白展堂愣了一下，随即咧嘴：“掌柜的出手，那还有跑？”你一边给三号桌道歉，一边把菜稳稳搁下，顺手给等座的老街坊添了茶。客人们见掌柜亲自跑堂，倒不好意思再催，笑声多了起来。胖子也安生坐下，点了四菜一汤。等午市散场，你胳膊发酸，嗓子冒烟，可柜台里铜钱响得实在，白展堂冲你抱拳：“掌柜的，服了。”"},{"id":"c_hire_temp","label":"临时雇人","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":6}],"effects":[{"kind":"resource","resourceId":"silver","delta":-6},{"kind":"resource","resourceId":"stamina","delta":2},{"kind":"resource","resourceId":"reputation","delta":1}],"text":"你从后门叫来街角闲着的赵五，塞给他几个铜板，让他专管端菜收碗。赵五手脚虽生，跑得却勤，白展堂腾出手来招呼客人，郭芙蓉也能安心收拾桌子。胖子和老街坊都及时吃上了热菜，门口没再堵人。吕秀才记下一笔短工钱，心疼得直咧嘴，你却觉得这钱花得值。银匣轻了些，可午市没砸锅，名声算是保住了。"},{"id":"c_rich_first","label":"先顾大客","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":12},{"kind":"resource","resourceId":"favor","delta":-4},{"kind":"resource","resourceId":"reputation","delta":-1}],"text":"你抢步上前，把绸衫胖子让到靠墙最宽敞的桌子，亲自布茶递菜单。胖子要了八菜一汤，碎银拍在柜台上叮当响。这边厢，靠窗老街坊等了两刻钟不见人来，茶壶空着也没人续，起身把铜板摞在桌上，冲你拱拱手：“佟掌柜，生意兴隆。”推门就走了。散客们你看看我、我看看你，嘀咕着“同福如今眼睛只认银子了”。白展堂在后头看得清楚，没吭声，只把抹布重重往肩上一搭。"}]},{"id":"m4_kitchen_fire","title":"灶台冒烟","kind":"main","locationIds":["loc_kitchen"],"text":"后厨一股青烟从铁锅底蹿起，李大嘴拿抹布乱扑，火苗舔着油星子“滋滋”响。白展堂探头一瞧，嚷道：“掌柜的，这灶要是不停火整修，怕连灶王爷都坐不住！”郭芙蓉拎起水桶就要泼，正犹豫间，油锅又爆出一阵呛人的焦味。\n\n账房吕秀才抱着算盘跑来：“换口好锅、清一回烟道，少说八两。”李大嘴苦着脸，手却悄悄摸向灶台边的油罐：“东家，剩下的油还能用，省点是点……”莫小贝从门缝里挤进来，捂着鼻子喊：“嫂子，客人都问啥味儿呢！”\n\n邢捕头恰在堂前喝茶，搁下杯子朝里张望，不咸不淡丢下一句：“佟掌柜，烟火气是好，可别把街坊都呛着。”钱掌柜在门外探了探头，笑眯眯摇头。\n\n锅还在冒烟，客还在等菜，佟湘玉得当场拍板：停火整修，还是让大嘴拿土法子先顶过去。","choices":[{"id":"c_fix_proper","label":"停火整修","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":8}],"effects":[{"kind":"resource","resourceId":"silver","delta":-8},{"kind":"resource","resourceId":"stamina","delta":-4},{"kind":"set","factId":"f_food_safety_incident","value":false}],"text":"你一咬牙让大嘴停火，请来修灶师傅清烟道、换铁锅。八两银子从柜上支出去，伙计们都咋舌，可后厨总算没了焦味。郭芙蓉抢着帮师傅递瓦刀，李大嘴嘴上嘟囔“旧锅还能使”，手却老老实实擦净灶台。停火两个时辰，客堂少接了几桌，可飘出去的烟散了，街坊也不再探头。秀才把修灶的账一笔笔记清，嘟囔道：“钱是花了，往后少个隐患。”"},{"id":"c_old_oil","label":"凑合再炸","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":4},{"kind":"set","factId":"f_food_safety_incident","value":true},{"kind":"resource","resourceId":"reputation","delta":-3}],"text":"你摆摆手，让大嘴把油撇了撇，兑上些新油凑合再炸。省下修灶银子，还多卖了四两现钱，可那股焦味半天没散尽。头桌客人皱着眉放下筷子，秀才在账上悄悄画了个圈。李大嘴自我安慰：“高温一炸，啥都干净。”话音未落，郭芙蓉端出去的菜又被退了回来，说是有股怪味。街面渐渐传开一句“同福后厨冒烟”，名声暗损，隐患也埋进了油锅里。"},{"id":"c_ask_li","label":"让李大嘴想法子","timeCost":1,"requires":[{"kind":"resource","resourceId":"favor","atLeast":25}],"effects":[{"kind":"resource","resourceId":"favor","delta":-2},{"kind":"resource","resourceId":"stamina","delta":-1},{"kind":"set","factId":"f_secret_recipe_known","value":true}],"text":"你把大嘴拉到灶边：“你的私房法子呢？再藏就馊了。”大嘴先是一愣，随即眉开眼笑，从围裙里摸出小本，说什么一勺醋、半碗水能去焦味。折腾半晌，烟果然小了，还省下修灶钱。可郭芙蓉嫌他把灶台弄得黏糊糊，摔了抹布；白展堂也抱怨闻着像打翻了醋坛子。大嘴得意忘形，顺口露出私房菜谱，伙计们心里各有盘算。人情搭了，手艺亮了，后厨却比先前更乱。"}]},{"id":"m5_ledger_gap","title":"账本对不上","kind":"main","locationIds":["loc_accounts"],"text":"吕秀才把算盘珠子拨得噼啪响，忽然手一停，脑门上沁出汗来：“掌柜的……今儿这流水，和匣子里的现钱，短了三两。”白展堂探过头来：“昨儿我收的桌钱都交柜上了，一文没敢留。”李大嘴在后头探头：“别看我，我买菜可都报过账。”吕秀才翻着那几张记菜单子，字迹有些发潮，抬头小声道：“要不……我再从头算一遍？就是怕对门听见动静，看笑话。”窗外钱掌柜正背着手踱过，往客栈门里瞟了一眼便走。柜上的账本摊开着，墨迹未干。","choices":[{"id":"c_investigate","label":"查缺口","timeCost":2,"requires":[{"kind":"resource","resourceId":"stamina","atLeast":5}],"effects":[{"kind":"resource","resourceId":"silver","delta":-3},{"kind":"resource","resourceId":"stamina","delta":-3},{"kind":"reveal","factId":"f_debt_due"},{"kind":"set","factId":"f_qian_sabotage_known","value":true}],"text":"你把这几日的单子一张张铺在柜上，拿镇纸压住，吕秀才守着一摞单据念，白展堂按着卖出的数对。查到午后，价钱上果然有条明糊涂账：几桌客人都说对门挂的价比咱们的还低，客人半道折了回去。又从抽屉底下翻出一张供货的旧欠条，上头写着限期。吕秀才咽了口唾沫：“掌柜的，这个得早做打算。”白展堂把那张欠条折起来揣进袖里，记够了两处要紧事，你这才觉出后背发酸，手边零钱也贴进去几文。"},{"id":"c_hide_gap","label":"先遮过去","timeCost":1,"effects":[{"kind":"resource","resourceId":"reputation","delta":-4},{"kind":"resource","resourceId":"favor","delta":-2}],"text":"你把账本一合，抬手道：“差几文是富余上头的零头，先不发嚷嚷，照着往常开门迎客。”伙计们应了，却各自对看一眼。郭芙蓉收桌子时明显轻手轻脚，白展堂在后堂压着嗓子问吕秀才“真不要紧”，被你一眼瞪了回去。柜上的数目被你抹得齐整了，晚饭后吕秀才来交账，临了小声问：“掌柜的，往后要是再短了……”话没说完又咽下去。街坊只当客栈照常，倒是几个来捧场的听说“账上没什么事”，面上客气着，结账时手脚慢了半分。"},{"id":"c_ask_lv","label":"让吕秀才再算","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":3},{"kind":"resource","resourceId":"stamina","delta":-1}],"text":"你把账本往吕秀才跟前一推：“你再算一遍，慢慢算，不急，算清了咱们心里才有数。”秀才如释重负，把算盘搬到亮处，从第一张单子重新来过。白展堂替他添了灯，李大嘴送来半碗热汤，郭芙蓉守在门口说“谁都不许进来吵”。重算到掌灯，秀才抬起头，眼里的慌退了大半：“先前是我把两笔外账记串了，数能对上，就是里头有两处对不拢。”众人齐齐松了口气，你陪着熬了这半日，腰也直不起来，可伙计们看你的眼神，比早上热络些。"}]},{"id":"m6_qian_price_war","title":"对门压价","kind":"main","locationIds":["loc_street"],"text":"钱掌柜站在对门店幌子底下，亲手把一块新写的木牌挂正，红漆字在日头底下扎眼：家常菜三文一份。他瞧见你，拱手笑得客气：“佟掌柜，小本生意，搅扰了。”郭芙蓉攥着抹布从堂里冲出来，白展堂在后头没拽住。街面几个熟客已探头探脑。吕秀才抱着账本小跑过来，声音发虚：“掌柜的，这价……咱一份回锅肉的本钱都不止三文。”李大嘴扒着厨房门框嚷：“那咱还炒不炒啦？”莫小贝挤在人缝里看热闹，回头冲你挤眼睛。对门伙计正卖力吆喝，声浪一阵阵拍过来。你脚边石板缝里还嵌着昨日的菜叶，手里算盘攥得发烫。","choices":[{"id":"c_match_price","label":"跟价到底","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":6}],"effects":[{"kind":"resource","resourceId":"silver","delta":-6},{"kind":"resource","resourceId":"reputation","delta":2},{"kind":"set","factId":"f_qian_truce","value":false}],"text":"你让秀才写块更红更大的牌子：“同福招牌菜，也三文！”郭芙蓉踩着凳子挂出去，街面哄一声热闹起来。头两桌客挤进门，专点便宜菜，李大嘴颠勺颠得满头汗，嘴里嘟囔本钱。白展堂跑堂跑到鞋底冒烟，悄悄拽你袖子：“掌柜的，这么卖，一晌午赔出去快六文了。”你数着铜板，名声确实响了，可钱匣子肉眼可见地轻下去。钱掌柜在对面看了一阵，笑容收了几分，没再吆喝，倒也没露面谈什么。"},{"id":"c_differentiate","label":"拿招牌菜说话","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":3},{"kind":"resource","resourceId":"silver","delta":-3}],"text":"你叫李大嘴把看家红烧肉端出试菜小碟，摆在门口让过路客尝。郭芙蓉扯着嗓子喊：“同福不拼价，只拼手艺！”白展堂顺势把几位犹豫的客往里请。有老街坊尝完点头，说还是这口实在。秀才在旁小声算，试菜折了三文，可进了两桌正价客。钱掌柜那边的低价牌子还挂着，围的人却散了些。李大嘴得了脸，颠勺声更响，还冲对门扬了扬下巴。你没跟钱掌柜搭话，但伙计们脸上松快，像憋的那口气终于吐出来了。"},{"id":"c_make_truce","label":"找钱掌柜谈和","timeCost":2,"requires":[{"kind":"resource","resourceId":"favor","atLeast":35}],"effects":[{"kind":"resource","resourceId":"silver","delta":-4},{"kind":"set","factId":"f_qian_truce","value":true}],"text":"你趁人少踱到对门，钱掌柜笑嘻嘻拱手，你先开口：“老钱，价压穿了对谁都没好处，街坊得了便宜，咱俩都喝西北风。”他眼皮跳了跳，叹气说也是被这月房钱逼的。两人立在两家幌子中间，约定熟菜不低过本钱，面上各让一步。你提出同福让四文做诚意，他愣了愣，收了低价牌。白展堂在门边望风，见状冲里头比个手势。郭芙蓉嘀咕“便宜他了”，被秀才拉住。街面恢复寻常，两家伙计隔街对望，都没先前那股火气。"}]},{"id":"m7_captain_inspection","title":"捕头巡街","kind":"main","locationIds":["loc_street"],"text":"邢捕头踱进同福客栈，燕小六跟在身后东张西望。他清了清嗓子：“佟掌柜，上头要查街面铺子的经营许可，手续齐全的挂红牌，不齐的嘛……先记账。”手指在柜台上敲了两下。白展堂往后退了半步，郭芙蓉从灶间探出头来。燕小六凑近小声说：“邢大哥说，街口钱掌柜那边昨天就办妥了。”邢捕头斜了他一眼，也不否认，只等佟湘玉开口。","choices":[{"id":"c_cooperate","label":"按规矩办","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":6}],"effects":[{"kind":"resource","resourceId":"silver","delta":-6},{"kind":"set","factId":"f_official_permit","value":true},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉数出六两银子，邢捕头接了，从怀里摸出一张盖了戳的许可条子，当场写上同福客栈的名号。燕小六贴到门框上，又回头笑说：“佟掌柜的，往后官面上的事我给您跑腿！”名声跟条子一起挂了起来。"},{"id":"c_bribe","label":"塞点辛苦钱","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":10}],"effects":[{"kind":"resource","resourceId":"silver","delta":-10},{"kind":"resource","resourceId":"favor","delta":-2},{"kind":"set","factId":"f_official_permit","value":true}],"text":"十两银子塞进袖袋，邢捕头拍拍袖子：“佟掌柜爽利，许可的事包在我身上。”他转身时，门外有街坊探头看见，低声议论了句什么。许可算到手了，人情却薄了一层。"},{"id":"c_stall","label":"先拖一拖","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":-4},{"kind":"resource","resourceId":"reputation","delta":-2}],"text":"佟湘玉连声说好话，沏上茶，又让李大嘴端出碟瓜子，只道账房先生出门对对账就回。邢捕头坐了一盏茶的工夫，茶喝完了，条子也没办，只丢下一句“改日再来”，门口留下几张瓜子皮与街坊的目光。"}]},{"id":"m8_charity_proposal","title":"街坊义卖提议","kind":"main","locationIds":["loc_hall"],"text":"午后大堂里，街坊赵婶子拎着半袋枣子闯进来，身后还跟着卖豆腐的老陈。她把枣子往桌上一搁，笑呵呵地说：“佟掌柜，这条街上数你面子大，咱们想办个义卖，给街口修座小桥，你看同福能不能牵个头？”郭芙蓉从后院探出脑袋，眼睛发亮；吕秀才在柜台后直摇头，手里算盘拨得噼啪响。白展堂端着茶壶凑过来，低声说：“掌柜的，牵头得搭银子，可应了这事，名声准能上去。”赵婶子又补一句：“不用多出，十两银子打底，再出几个人手就成。”李大嘴在厨房门口搓手：“那得管饭吧？”莫小贝拍手叫好，被佟湘玉一眼瞪回去。十两只出不进，可街坊都看着，账本和人心，哪头更要紧？","choices":[{"id":"c_lead_fair","label":"牵头办义卖","timeCost":3,"requires":[{"kind":"resource","resourceId":"favor","atLeast":40},{"kind":"resource","resourceId":"silver","atLeast":10}],"effects":[{"kind":"resource","resourceId":"silver","delta":-10},{"kind":"resource","resourceId":"favor","delta":8},{"kind":"set","factId":"f_charity_ready","value":true},{"kind":"set","factId":"f_charity_fair_done","value":true},{"kind":"resource","resourceId":"reputation","delta":4}],"text":"佟湘玉一拍桌：“办！同福牵头，十两银子先垫上！”赵婶子乐得直拍手，老陈当场答应把豆腐摊挪到义卖场边。郭芙蓉揽下搭棚的力气活，白展堂跑去街尾传话，连李大嘴都答应支口大锅熬汤。银子花出去，街坊们却更认同福这块招牌。（银钱-10，人情+8，名声+4）"},{"id":"c_delegate_fair","label":"让街坊张罗","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":3},{"kind":"set","factId":"f_charity_ready","value":true}],"text":"佟湘玉笑说：“我这儿实在腾不开手，你们张罗，同福出两个人帮衬。”赵婶子脸上笑着，转头却跟老陈嘀咕“掌柜的这是不使劲”。郭芙蓉倒乐得去搭把手，可人少声弱，义卖的事只停在口头上，没个准日子。（人情+3，筹备·虚）"},{"id":"c_decline_fair","label":"婉拒","timeCost":1,"effects":[{"kind":"resource","resourceId":"reputation","delta":-2},{"kind":"resource","resourceId":"favor","delta":-1}],"text":"佟湘玉推说这几日进货压手，实在腾不出空。赵婶子忙说“理解理解”，手里的枣子却往回拎了拎，老陈也讪讪告辞。莫小贝追到门口喊“回头我帮你们送茶”，被郭芙蓉拉回来。街坊面上带笑出去，转身就凑在一处低声说话。（名声-2，人情-1）"}]},{"id":"m9_night_settlement","title":"夜里日结","kind":"main","locationIds":["loc_accounts"],"text":"油灯挑到最亮，算盘珠子被吕秀才拨得噼啪响。柜台上摊着今日流水，白展堂把抹布往肩头一搭，斜眼瞧着钱匣子；郭芙蓉搬完最后一摞碗，故意在门口站定不走；李大嘴攥着张菜价单，嘴里念叨明早的肉该涨了。莫小贝趴在楼梯扶手上探头：“嫂子，今晚分钱不？”佟湘玉把账页翻到最后一行，指尖在匣盖上敲了两下——发工钱、留现银、还是再押一批货，三样都在这盏灯底下摆着。","choices":[{"id":"c_pay_staff","label":"给伙计加钱","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":10}],"effects":[{"kind":"resource","resourceId":"silver","delta":-10},{"kind":"resource","resourceId":"favor","delta":5},{"kind":"set","factId":"f_staff_bonus_paid","value":true}],"text":"佟湘玉把匣子里的碎银一一数出，拍在柜台上。白展堂接了，眉毛一挑：“掌柜的今儿敞亮。”郭芙蓉把钱往怀里一揣，转身就把明日要洗的碗提前码好。李大嘴咧嘴笑，说明早多加一勺肉臊子。吕秀才忙在账上记清，手却不抖了。伙计们散去时脚步都轻快，只钱匣子薄了一层。"},{"id":"c_save_cash","label":"多留现银","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":5},{"kind":"resource","resourceId":"favor","delta":-3}],"text":"佟湘玉合上匣盖，手按在上面：“今儿都紧着点，明儿再说。”白展堂“哦”了一声，抹布往桌上一搁，没再多话。郭芙蓉撇嘴，脚步重了些上楼。李大嘴嘀咕一句明早的肉钱，也散了。吕秀才把账记完，小声说匣子里是厚实了些。灯影里钱是留下了，可伙计们的脸也淡了下去。"},{"id":"c_reinvest","label":"补库存","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":12}],"effects":[{"kind":"resource","resourceId":"silver","delta":-12},{"kind":"resource","resourceId":"stock","delta":5},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉点了十二两推给李大嘴：“明早的货，挑新鲜的进，别再图便宜。”李大嘴眼一亮，连声应下，菜价单都卷起来了。白展堂掂了掂账，说这批货上得快，客人挑不出错。吕秀才把库存添在账页上，添了五份。钱匣子轻了，可后厨和库房都添了底气，明日的灶火有着落。"}]},{"id":"m10_long_stay_guest","title":"长住客压价","kind":"main","locationIds":["loc_hall"],"text":"午后大堂人不多，一个风尘仆仆的客人把包袱往桌上一搁，开口就要一间便宜客房，连住七八天，还非要掌柜给个实在价。白展堂在旁边擦桌子，耳朵却竖着；吕秀才翻着账本，悄悄拿笔杆戳了戳佟湘玉，小声嘀咕：“这价儿要是应了，房钱可就薄了。”郭芙蓉端茶路过，直接插嘴：“长住省心，总比空着强！”客人却不急，从包袱里摸出几包干货，又数了把铜钱，笑眯眯等着掌柜拍板。","choices":[{"id":"c_guest_discount","label":"给折扣","timeCost":2,"effects":[{"kind":"resource","resourceId":"silver","delta":8},{"kind":"resource","resourceId":"favor","delta":2},{"kind":"set","factId":"f_long_guest_booked","value":true}],"text":"佟湘玉把算盘一拨，给客人抹了个零头，又把茶水管够。客人痛快付了定钱，白展堂麻利拎包上楼。虽说每间房赚得薄，但七八天的房钱稳当，客人还连夸同福会做生意。郭芙蓉得意地冲秀才挑眉，秀才撇嘴记账，银钱入袋八两，人情也热络了几分。"},{"id":"c_guest_full","label":"按牌价","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":14},{"kind":"resource","resourceId":"reputation","delta":-1},{"kind":"set","factId":"f_long_guest_booked","value":true}],"text":"佟湘玉不慌不忙报出牌价，客人嘴上嘟囔“别家可没这么贵”，手上却还是掏了银子。白展堂笑着打圆场，说咱这儿热水热饭伺候得周全。客人到底订了房，银钱柜上多了十四两，可转过身上楼时脸色微沉，秀才小声提醒名声可能受了点影响。"},{"id":"c_guest_barter","label":"拿货抵房钱","timeCost":2,"effects":[{"kind":"resource","resourceId":"stock","delta":3},{"kind":"resource","resourceId":"favor","delta":4},{"kind":"set","factId":"f_long_guest_booked","value":true}],"text":"佟湘玉眼光在那几包干货上一转，跟客人商量拿货抵房钱。客人乐得省下现银，痛快点头。李大嘴凑过来翻检货物，直说能用得上。客房定了出去，厨房平白多出三份库存，客人也夸掌柜会变通，人情添了几分，银钱却没怎么动。"}]},{"id":"m11_li_secret_recipe","title":"李大嘴的私房菜","kind":"main","locationIds":["loc_kitchen"],"text":"后厨飘着葱油味儿。李大嘴把门帘一撂，从围裙里摸出个油渍麻花的本子，压着嗓门：“掌柜的，您瞧这个——我琢磨大半年的私房菜。”他翻开一页，上面歪歪扭扭画着炖肉方子，旁边还标着“千万别让对门知道”。郭芙蓉凑过来伸脖子，被李大嘴一把挡住：“去去去，先让掌柜定夺。”白展堂倚在门框上嗑瓜子：“大嘴，你这菜谱靠谱吗？上回你说‘祖传’，结果是你二舅从赌桌上赢来的。”李大嘴急得直跺脚。佟湘玉，这菜谱是买断、共享，还是先试一锅？","choices":[{"id":"c_buy_recipe","label":"花钱买下","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":12}],"effects":[{"kind":"resource","resourceId":"silver","delta":-12},{"kind":"set","factId":"f_secret_recipe_known","value":true},{"kind":"resource","resourceId":"stock","delta":3}],"text":"佟湘玉数出十二两银子拍在案板上，李大嘴眼都直了，捧过银子咬了咬边儿：“掌柜的您放心，这菜谱独一份！”他把本子双手奉上，又主动添了三份配好的半成品码进库房。郭芙蓉在旁边嘟囔：“十二两够买半扇猪了……”佟湘玉翻开菜谱，只见第一页写着“盐少许、酱油适量”——她抬头看李大嘴，李大嘴挠着头嘿嘿笑：“少许嘛，就是……凭感觉。”账房那边，吕秀才已经把这笔支出一笔一划记上。"},{"id":"c_share_recipe","label":"让后厨共享","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":4},{"kind":"set","factId":"f_secret_recipe_known","value":true},{"kind":"resource","resourceId":"reputation","delta":1}],"text":"佟湘玉把本子往灶台上一放：“既是私房菜，就大伙儿一块儿瞧。”李大嘴愣了愣，随即咧着嘴把围裙一系：“得嘞！掌柜的信我，我就露一手！”他当场支起锅，郭芙蓉抢着添柴，白展堂负责尝咸淡。一锅到底没够分，伙计们边吃边添，后厨闹腾得跟过年似的。李大嘴被夸得脸红，主动把菜谱抄了一份贴在灶头：“谁想瞧谁瞧。”门口路过的街坊闻见味儿，探头问今儿卖不卖。"},{"id":"c_test_recipe","label":"直接试做","timeCost":2,"effects":[{"kind":"resource","resourceId":"stamina","delta":-3},{"kind":"resource","resourceId":"stock","delta":-1},{"kind":"set","factId":"f_food_safety_incident","value":true}],"text":"李大嘴按着本子抓了把干辣椒下锅，油星子“啪”地溅起来，他手一哆嗦，半碗酱油全扣进锅里。白展堂拎着抹布冲进来：“着火了？”郭芙蓉被呛得直咳嗽，开窗往外扇烟。佟湘玉抄起锅盖压火，手忙脚乱间碰翻了一盆切好的肉，掉在地上没法用了。李大嘴盯着黑乎乎的锅底直搓手：“这方子……火候得改。”吕秀才闻到味儿跑来，皱着眉头记了一笔食材损耗。"}]},{"id":"m12_supplier_credit","title":"供货商催款","kind":"main","locationIds":["loc_kitchen"],"text":"后厨门槛上还沾着菜叶，老周把麻袋往地上一墩，掏出皱巴巴的账单：“佟掌柜，上回那批干货的账，今儿得结一结。”李大嘴探出半个脑袋，眼睛直勾勾盯着麻袋里的香菇，手在围裙上蹭了又蹭。白展堂靠着门框，低声嘀咕：“这人嘴紧，可认现银。”你捏着账单，心里盘算着柜上那点银子——是拆东墙补西墙赊一批，还是咬牙付现，或是干脆少进点货，先紧着这礼拜的菜单。","choices":[{"id":"c_negotiate_credit","label":"谈赊账","timeCost":2,"requires":[{"kind":"resource","resourceId":"favor","atLeast":35}],"effects":[{"kind":"resource","resourceId":"stock","delta":8},{"kind":"resource","resourceId":"silver","delta":-2},{"kind":"set","factId":"f_supplier_credit","value":true}],"text":"你把老周请到角落，搬出同福客栈往年节礼相赠的旧情，又许他下回优先挑好货。老周捻着胡子想了半晌，终于松口：“赊半个月，利钱免了，可别让我跑第二趟。”八份干货搬进库房，你数出二两碎银当定钱，老周揣好银子，顺手把空麻袋叠得整整齐齐，临走还冲李大嘴喊了句“省着用，香菇可不经放”。"},{"id":"c_pay_cash","label":"现银结账","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":12}],"effects":[{"kind":"resource","resourceId":"silver","delta":-12},{"kind":"resource","resourceId":"stock","delta":10}],"text":"你让吕秀才从柜上取了十二两现银，一字排开摆在灶台边。老周伸手一锭锭验过成色，脸上褶子都笑开了，麻利地卸下十份干货，还额外抓了把虾皮添进筐里：“佟掌柜爽快，下回新货先紧着您！”李大嘴抱着香菇筐不撒手，连说今晚就试新菜。账面上少了一截银子，可厨房的料筐子眼见着满了起来。"},{"id":"c_refuse_supply","label":"少进一批","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":1},{"kind":"resource","resourceId":"stock","delta":-1}],"text":"你把账单按在桌上，跟老周商量只留半扇排骨，其余的先退回去。老周脸沉了沉，到底没说什么，把麻袋重新扎口扛上肩，临走撂下一句：“下回可就没这个价了。”李大嘴对着空了一角的料筐直叹气，你把他支去洗锅，自己灌了碗凉茶缓劲儿——省下的是现银，可今晚的菜单上，荤菜得减一道了。"}]},{"id":"m13_rival_sabotage","title":"对门拆台","kind":"main","locationIds":["loc_street"],"text":"七侠镇街口，风传同福客栈的菜价“猫腻”。钱掌柜摇着扇子在自家门口搭话：“佟掌柜，听说你那菜里肉少得能数清？”郭芙蓉急得攥拳，白展堂低声劝：“掌柜，没凭没据，当街吵吃亏。”吕秀才抱着账本缩在后头。街坊三三两两往这边瞅，灶上正炖着李大嘴的红烧肉，香气飘出来。","choices":[{"id":"c_expose","label":"当街揭穿","timeCost":2,"requires":[{"kind":"resource","resourceId":"reputation","atLeast":40}],"effects":[{"kind":"resource","resourceId":"reputation","delta":4},{"kind":"resource","resourceId":"favor","delta":-2},{"kind":"set","factId":"f_qian_sabotage_known","value":true}],"text":"你把这几日对门伙计来探价的时辰、原话一一当众摆出，街坊面面相觑。钱掌柜扇子一合，脸色发僵，硬笑道：“误会误会。”众人虽散了，但有人觉得你太不留情面，人情略损。对门拆台的底细已被你摸清。"},{"id":"c_counter","label":"拿好菜反击","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":4}],"effects":[{"kind":"resource","resourceId":"silver","delta":-4},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"你不争口舌，招呼李大嘴端出热腾腾的红烧肉，请街坊尝个鲜。肉香勾得人直咽口水，钱掌柜门前冷清下来。你贴出今日平价菜牌，众人边吃边夸。四两银子花在食材上，名声却实打实涨了几分。"},{"id":"c_ignore_rumor","label":"先不理","timeCost":1,"effects":[{"kind":"resource","resourceId":"reputation","delta":-3},{"kind":"resource","resourceId":"stamina","delta":2}],"text":"你摆摆手，让伙计们照常干活，自己回后院歇了口气，省得跟人在街口斗嘴。风言风语却没停，有客人进门时还探头探脑。体力缓过些，可街面上对客栈的指指点点又多了几分。"}]},{"id":"m14_official_banquet","title":"官面大单","kind":"main","locationIds":["loc_hall"],"text":"邢捕头一脚踏进门槛，腰刀磕在门框上叮当响：“佟掌柜，三日后县衙有一桌官宴，十道菜、两坛好酒，你接不接？”白展堂在柜台后头使眼色，吕秀才已经翻开了账本。后厨传来李大嘴剁菜的响动，郭芙蓉提着水桶愣在井边。十道菜得备足四份库存，还得全店连轴转。邢捕头又补一句：“上回对门钱掌柜可没敢接，说怕砸了招牌。”这话像算盘珠子拨到了佟湘玉心尖上。","choices":[{"id":"c_accept_banquet","label":"接单","timeCost":3,"requires":[{"kind":"resource","resourceId":"stock","atLeast":4},{"kind":"resource","resourceId":"stamina","atLeast":8}],"effects":[{"kind":"resource","resourceId":"silver","delta":25},{"kind":"resource","resourceId":"stock","delta":-4},{"kind":"resource","resourceId":"stamina","delta":-8},{"kind":"set","factId":"f_official_permit","value":true}],"text":"邢捕头留下定金，拍板三日后开席。佟湘玉扯开嗓子分派：“展堂，你跑腿采买；芙蓉，桌椅全擦一遍；大嘴，私房菜谱别藏着，这回得露真功夫！”银钱进匣叮当响，库存一下空了四份。吕秀才连夜重排菜单，白展堂嘀咕“官面饭可不好端”，还是拎着篮子出了门。郭芙蓉把袖子一挽，扛起面袋就往灶房走。"},{"id":"c_subcontract","label":"分给钱掌柜一半","timeCost":2,"requires":[{"kind":"fact","factId":"f_qian_truce","value":true}],"effects":[{"kind":"resource","resourceId":"silver","delta":12},{"kind":"resource","resourceId":"favor","delta":3}],"text":"佟湘玉笑眯眯把话头递到邢捕头跟前：“大人，这十道菜全让同福独吞，对门钱掌柜该说我吃独食啦。不如两家各出五道，您面子里子都全乎。”钱掌柜被请来，脸上讪讪的，到底点了头。两家灶火同开，银子少赚一半，可对门送来的鲜鱼和干菇抵了部分开销。伙计们虽嘀咕肥水外流，见掌柜游刃有余，也就卖力干活。"},{"id":"c_decline_banquet","label":"不敢接","timeCost":1,"effects":[{"kind":"resource","resourceId":"reputation","delta":-2},{"kind":"resource","resourceId":"favor","delta":1}],"text":"佟湘玉搓着手赔笑：“邢大哥，不是我不给官面面子，实是这几日后厨忙不过来，怕耽误了您大事。”邢捕头脸一沉，刀鞘往桌上一搁：“同福客栈也有不敢接的单子了？”说罢拔腿就走，带起一阵门帘风。街对门钱掌柜探头探脑，笑纹藏都藏不住。郭芙蓉愤愤不平：“掌柜的，咱又不是没锅没灶！”佟湘玉摆摆手，心里却琢磨：少赚这一笔，街面上怕要传同福不识抬举了。"}]},{"id":"m15_food_safety","title":"食材变味","kind":"main","locationIds":["loc_kitchen"],"text":"后厨里，李大嘴举着一把发蔫的青菜，凑近一闻，眉头拧成疙瘩。“掌柜的，这菜……味儿不对了。”案板上还摊着半扇颜色发暗的肉。郭芙蓉捏着鼻子退到门口，白展堂斜靠在灶台边，拿抹布扇风：“这要是端出去，客人怕是要掀桌子。”吕秀才从账本后探出头，小声补了句：“重买得四两银子，库存也得少两份。”莫小贝踮脚张望，被佟湘玉一个眼神挡回去。三双眼睛盯着她，等一句准话。","choices":[{"id":"c_discard","label":"全丢","timeCost":2,"effects":[{"kind":"resource","resourceId":"stock","delta":-2},{"kind":"resource","resourceId":"silver","delta":-4},{"kind":"set","factId":"f_food_safety_incident","value":false},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉把发蔫的菜和暗色的肉统统扔进泔水桶，又数出四两碎银递给李大嘴：“重买，挑新鲜的，别贪便宜。”大嘴乐呵呵地跑出门，郭芙蓉跟着去搬货。白展堂拿抹布把案板重擦一遍，嘴里嘟囔：“亏是亏了，可心里踏实。”吕秀才在账本上添了一笔，小声说：“名声要紧，这钱不算白花。”"},{"id":"c_use_anyway","label":"凑合用","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":8},{"kind":"set","factId":"f_food_safety_incident","value":true},{"kind":"resource","resourceId":"reputation","delta":-5}],"text":"佟湘玉一咬牙：“多搁姜蒜，先做给散客，别声张。”李大嘴缩了缩脖子，到底还是把菜下了锅。当晚客人吃着不对味，拍桌子喊来白展堂，白展堂支吾着赔笑，郭芙蓉在旁干瞪眼。佟湘玉赔着不是免了单，回头一算，省下的食材钱远不够填名声的窟窿，街坊的话头已经往坏处跑了。"},{"id":"c_disguise","label":"多放调料遮味","timeCost":1,"requires":[{"kind":"resource","resourceId":"favor","atLeast":30}],"effects":[{"kind":"resource","resourceId":"silver","delta":3},{"kind":"resource","resourceId":"reputation","delta":-3},{"kind":"set","factId":"f_food_safety_incident","value":true}],"text":"佟湘玉把李大嘴拽到一边：“你那个私房酱料，多搁一勺，把味儿遮过去。”李大嘴犹豫片刻，还是照办了。郭芙蓉端菜上桌，客人皱眉说“咸得发苦”，但没多追究。银子是省下几个，可佟湘玉看见客人盘子剩了大半，心里直打鼓。白展堂低声提醒：“掌柜的，这事儿瞒得了一时。”吕秀才在账本边角写了“隐患”两个字。"}]},{"id":"m16_debt_collector","title":"债主上门","kind":"main","locationIds":["loc_street"],"text":"七侠镇街口，日头刚偏西。粮行胡掌柜堵在同福客栈门前，手里抖着一张旧欠条，背后还跟着个扛麻袋的伙计。“佟掌柜，上回那五十斤白面、二十斤干菇的账，说好半月结，今儿可到期了。”他语气不冲，脚却不动。白展堂缩在门框边冲你使眼色，意思是别惹急了。郭芙蓉拎着水桶站在台阶下，悄悄往你身边靠。远处对门钱掌柜探出半个身子看热闹，手里还攥着把瓜子。","choices":[{"id":"c_repay_debt","label":"先还一部分","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":15}],"effects":[{"kind":"resource","resourceId":"silver","delta":-15},{"kind":"set","factId":"f_debt_due","value":false}],"text":"你让吕秀才取来账本，当着胡掌柜的面数出十五两。铜钱在柜台上摊开，胡掌柜脸色松了些，把旧条子折了个角，说余下的宽限几日。他走后吕秀才小声补了一句：“这月的进货钱又紧喽。”白展堂把条子收进账匣，顺手记下日子。银子少了，可街口没人再围着看，钱掌柜也缩回了自家门里。"},{"id":"c_delay_debt","label":"说好话拖延","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":-3},{"kind":"set","factId":"f_debt_due","value":true},{"kind":"resource","resourceId":"stamina","delta":-2}],"text":"你拉着胡掌柜在檐下说话，从街坊交情讲到粮行周转，嗓子说干，总算把日子往后挪了三天。胡掌柜收条子时哼了一声：“佟掌柜，我信你这一回，可下回我就不是站着说了。”他走远了，郭芙蓉还回头瞪了一眼。白展堂递上凉茶，你灌了两口才缓过气。欠账还记在账上，人情却薄了一层，街口看热闹的也都散了。"},{"id":"c_borrow_more","label":"再借一笔","timeCost":2,"effects":[{"kind":"resource","resourceId":"silver","delta":10},{"kind":"set","factId":"f_debt_due","value":true},{"kind":"resource","resourceId":"reputation","delta":-4}],"text":"你话头一转，问胡掌柜手头还有没有余粮能再赊十两银子的货。他眯眼打量你半晌，到底点了头，先给你十两应急，又在账本上添了一笔。银子入手时沉甸甸，可吕秀才翻账时笔尖直抖，白展堂咂咂嘴：“掌柜的，这窟窿可不小啦。”对门钱掌柜瞧见那银锭过手，慢悠悠嗑完瓜子，转身回铺，脸上笑味难辨。"}]},{"id":"m17_final_accounts","title":"收市核账","kind":"main","locationIds":["loc_accounts"],"when":[{"kind":"time","atLeast":50}],"text":"收市后，同福客栈大堂的桌子拼成了一张大台。吕秀才把一天的流水、赊条、菜钱摊了满满一桌，算盘珠子拨得噼啪响，额角却有点冒汗。白展堂拎着抹布站在旁边看热闹，郭芙蓉端来一碗凉茶，李大嘴在灶房门口把剩下半碗肉片往嘴里一扒。莫小贝趴在柜台边上问：“嫂子，咱今儿是不是赚了？”吕秀才抬起头，声音发虚：“大致是……大致要再对一遍。”桌上那几页账一页压着一页，数字看着热闹，真要拿给人交代，还差最后一道工。","choices":[{"id":"c_final_audit","label":"认真核平","timeCost":3,"requires":[{"kind":"resource","resourceId":"favor","atLeast":30}],"effects":[{"kind":"set","factId":"f_ledger_balanced","value":true},{"kind":"resource","resourceId":"silver","delta":-8},{"kind":"resource","resourceId":"stamina","delta":-4}],"text":"灯芯挑亮，吕秀才念一页，佟湘玉拨一遍算盘，白展堂把散落的零钱按串码齐。厨房的葱钱、客房的茶包、街坊赊的几壶酒，一笔笔摊平。天快亮时，吕秀才长出一口气：“平了，一文不差。”银钱花出去八两补上亏空的零头，人也熬得眼皮发沉，可账本总算能正正经经摊给任何人看。"},{"id":"c_final_pay","label":"先还旧账","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":15}],"effects":[{"kind":"resource","resourceId":"silver","delta":-15},{"kind":"set","factId":"f_debt_due","value":false},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉没急着盘账，先叫人把桌角那张催条拿来，数出十五两银子让白展堂连夜送过去。供货的旧账一清，对方收了银子，第二日见人便说同福客栈说话算数。名声在街面上稳了一点，只是账桌上少了这十五两，吕秀才捏着笔，得把剩下的进出重新归置一遍。"},{"id":"c_cook_books","label":"做假账","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":12},{"kind":"resource","resourceId":"reputation","delta":-6},{"kind":"set","factId":"f_ledger_balanced","value":false}],"text":"吕秀才按佟湘玉的意思，把几笔进项挪了个地方，账面顿时顺眼，还多出十二两活钱。他一边写一边低声道：“掌柜的，这数经不起第二个人细看。”银钱是现的，名声却已在街面上落了口风，有人嘀咕同福的账做得太巧。账本没轧平，这一页翻过去，后面迟早还得回来。"}]},{"id":"m18_final_decision","title":"打烊前定路线","kind":"main","locationIds":["loc_hall"],"when":[{"kind":"time","atLeast":55}],"text":"打烊的灯笼刚点上，同福客栈里还飘着最后一道熘鱼片的醋香。佟湘玉把算盘往柜台上一搁，伙计们围过来：白展堂靠着门框打哈欠，郭芙蓉擦着桌子偷听，吕秀才捧着账本手有点抖，李大嘴从灶间探头，莫小贝趴在楼梯上晃腿。\n\n“掌柜的，今儿个流水不错，可明儿个咋个走法，您得给句准话。”白展堂努努嘴。郭芙蓉抢道：“咱能干的都干了，您说往东咱不往西！”吕秀才把账本推过来：“账是平了，可银子压着不踏实。”窗外对门钱掌柜正上门板，故意大声说风凉话：“有些铺子，赚了吆喝赔了本，别硬撑啊。”邢捕头巡逻路过，冲里头拱拱手：“有事招呼一声。”\n\n佟湘玉看着这一屋子人，手指在算盘珠上一捻——是稳稳当当收账，还是拿人情换明天的客，又或者赌一把大单，得有个决断了。","choices":[{"id":"c_steady_close","label":"稳账收束","timeCost":2,"requires":[{"kind":"fact","factId":"f_ledger_balanced","value":true},{"kind":"resource","resourceId":"silver","atLeast":60},{"kind":"resource","resourceId":"reputation","atLeast":45}],"effects":[{"kind":"resource","resourceId":"silver","delta":-5},{"kind":"ending","endingId":"ending_steady_profit"}],"text":"佟湘玉把算盘一清，当众念了日结：账本轧平，柜上银子留足底，名声也没跌。她抽了五两给吕秀才封存作周转，又给伙计们一人添了碗热汤面。“咱不贪大，稳稳当当把客留住。”白展堂点头去上门板，郭芙蓉把明日菜单擦得锃亮。对门钱掌柜探头，佟湘玉只笑笑不接话。夜里算盘收进柜底，同福的灯比平日熄得踏实——薄利虽薄，账上见真。"},{"id":"c_goodwill_close","label":"人情收束","timeCost":2,"requires":[{"kind":"resource","resourceId":"favor","atLeast":65},{"kind":"fact","factId":"f_qian_truce","value":true},{"kind":"fact","factId":"f_charity_fair_done","value":true}],"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"ending","endingId":"ending_goodwill_network"}],"text":"佟湘玉让伙计把街坊送的义卖红纸贴在堂中，又请钱掌柜进来喝了碗热茶。钱掌柜讪讪道：“今儿算你赢一回。”两家约定明日互通客源，邢捕头也来凑了个趣。郭芙蓉嗓门最大：“咱同福靠的是人缘！”白展堂在旁小声提醒掌柜别忘了给伙计加钱，佟湘玉笑着应下。人情攒到这份上，柜上现银虽不算厚，可街面上下都认同福这块招牌，往后的客源比这一晚的流水更长。"},{"id":"c_risky_close","label":"大单收束","timeCost":2,"requires":[{"kind":"fact","factId":"f_official_permit","value":true},{"kind":"resource","resourceId":"silver","atLeast":85},{"kind":"fact","factId":"f_food_safety_incident","value":false}],"effects":[{"kind":"resource","resourceId":"reputation","delta":2},{"kind":"ending","endingId":"ending_risky_banquet"}],"text":"佟湘玉把官面许可往柜台上一拍，连夜接了明日的宴席大单。吕秀才拨着算珠直冒汗，李大嘴已撸袖子要开灶。白展堂压低声音：“掌柜的，这单子要是砸了，可不好收场。”郭芙蓉拍胸脯包了跑堂送菜。银子流水哗哗地进，名声也往上走，只是佟湘玉夜里算了三遍食材账，没敢松劲儿——高风险大单落定，险中得利，后头还得盯紧每一道菜。"},{"id":"c_hold_cash","label":"先不结算","timeCost":1,"effects":[{"kind":"resource","resourceId":"silver","delta":8},{"kind":"resource","resourceId":"reputation","delta":-2}],"text":"佟湘玉把算盘一合，没急着定路线，只让吕秀才把散银先收进柜底。“再等等，明儿个看行情。”伙计们面面相觑，郭芙蓉嘟囔一句“掌柜的有主意”。白展堂没多话，把门板一块块上好。银子压在手里踏实了些，可街坊看在眼里，有人嘀咕同福是不是要缩手。佟湘玉听见也只当没听见，把油灯拨亮些——等是要等的，可等久了，名声这碗水也容易凉。"}]},{"id":"r1_serve_guest","title":"招呼一桌散客","kind":"repeat","locationIds":["loc_hall"],"repeat":{"cooldownTurns":1},"textVariants":["正厅靠窗那桌坐了三个赶路的脚夫，扁担还靠在条凳边上。白展堂把抹布往肩上一搭，凑过来小声说：“掌柜的，人家问咱这儿有啥热乎的，还问贵不贵。”郭芙蓉已经拎着茶壶过去倒水，回头朝你使眼色。后厨那边李大嘴敲了两下锅沿，意思是锅还热着，菜出得快。你手里翻着菜单，心里先拨了一遍算盘：库存还剩多少，今天流水走到哪一步，自己这两条腿还能撑几趟楼。脚夫里年长那个把铜钱串往桌上一搁：“掌柜的，我们不挑，就是吃完还得赶路。”","另一拨是走亲戚的两口子，女的抱着包袱，男的先探头看墙上菜牌，又问有没有干净客房。莫小贝从楼梯口蹿下来，嘴快：“嫂子，我哥问，咱家那个贵些的菜还有没有？”白展堂赶紧把她拉到一边，压低声音：“掌柜的，这桌瞧着舍得花钱，可也别把话说满了。”吕秀才抱着账本从柜台后探出头，欲言又止，显然是怕这单收钱对不上。茶壶嘴还冒着热气，客人等着回话，后厨的锅铲又响了一声。"],"choices":[{"id":"c_serve_normal","label":"正常上菜","timeCost":2,"requires":[{"kind":"resource","resourceId":"stock","atLeast":1},{"kind":"resource","resourceId":"stamina","atLeast":4}],"effects":[{"kind":"resource","resourceId":"silver","delta":6},{"kind":"resource","resourceId":"stock","delta":-1},{"kind":"resource","resourceId":"stamina","delta":-4},{"kind":"resource","resourceId":"reputation","delta":1}],"text":"你朝后厨应了一声，李大嘴手脚麻利，一盘热菜配两样小菜很快端上桌。脚夫们吃得踏实，年长的那个抹抹嘴，把铜钱一枚枚数给你，说下回还认同福的门。白展堂收碗时冲你挤挤眼，郭芙蓉把桌子擦得锃亮。银钱进了钱匣，库存少一份，你虽跑了两趟腿，名声却在客人嘴里落了个实在。"},{"id":"c_serve_upsell","label":"推荐贵菜","timeCost":2,"requires":[{"kind":"resource","resourceId":"stock","atLeast":2}],"effects":[{"kind":"resource","resourceId":"silver","delta":9},{"kind":"resource","resourceId":"stock","delta":-2},{"kind":"resource","resourceId":"favor","delta":-1}],"text":"你把菜牌往那对走亲戚的客人面前一推，拣着贵些的荤菜说了两句。男的犹豫一下还是点了，女的却把包袱搂紧了些，低声嘀咕一句“出门在外真费钱”。菜上得齐整，钱也收得漂亮，可那位妇人出门时没接郭芙蓉递的送客话。银钱多进了几枚，库存去了两份，你心里明白这桌客下回未必再进这个门。"},{"id":"c_serve_rush","label":"快餐快走","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":-2},{"kind":"resource","resourceId":"silver","delta":3}],"text":"你冲后厨喊了声“快”，李大嘴把现成的菜热了热就往外端。脚夫们倒不讲究，三两口扒完，抹嘴就走，铜钱搁在桌上还带着汗气。翻台是快了，可碗筷收得急，白展堂险些撞上起身的客人，郭芙蓉嘟囔一句“跟赶集似的”。银钱进得不多，你倒省下一份库存，只是两条腿又酸了一层。"}]},{"id":"r2_rest_backyard","title":"后院歇口气","kind":"repeat","locationIds":["loc_backyard"],"repeat":{"cooldownTurns":2},"textVariants":["午后后院静得很，太阳把磨盘晒得发烫。李大嘴蹲在菜筐边翻拣，嘴里念叨：‘掌柜的，这筐底下几棵白菜还硬挺，别扔啊。’郭芙蓉靠在井台边擦汗，白展堂从后门探进半个脑袋，低声提醒：‘对门钱掌柜方才在街口转悠，不知打什么主意。’莫小贝趴在石桌上写大字，眼珠却往茶壶上瞟。你站在廊下，只觉得腿脚发酸，可后院里处处都是活儿。","后院的槐树投下一片阴凉，风里带着灶间剩的油烟味。吕秀才抱着账本小跑进来，翻了两页又合上：‘掌柜，今儿流水还没轧平，不过——’话没说完，郭芙蓉拎着一只水桶从旁边过，桶底磕在石阶上咣当一响。白展堂正帮李大嘴把半袋子干货往棚里挪，顺手抹了把汗。你瞧见墙角还堆着几只没拆的杂货包，心里盘算着是歇一歇还是顺手盘一盘。"],"choices":[{"id":"c_nap","label":"靠墙打个盹","timeCost":2,"effects":[{"kind":"resource","resourceId":"stamina","delta":10},{"kind":"resource","resourceId":"silver","delta":-1}],"text":"你靠墙眯了一会儿，院里的响动渐渐远了。再睁眼时，太阳偏了些，脑袋没先前那么沉。白展堂轻手轻脚把茶壶放在你手边，低声说：‘掌柜的，刚才对门钱掌柜在街口晃了一圈，没往咱这边来。’你点点头，摸出几文钱让郭芙蓉去买些粗点心分给伙计，体力回来一些，银钱也少了。"},{"id":"c_tea","label":"喝碗粗茶","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":5},{"kind":"resource","resourceId":"favor","delta":1}],"text":"你舀了碗粗茶，招呼伙计们轮流歇口气。郭芙蓉先灌了半碗，抹嘴说：‘掌柜的，今儿这茶比平日香。’白展堂接过话茬，笑嘻嘻讲了件街面上的趣事，李大嘴听得直拍腿。你听着伙计们闲扯，自己只喝了两口，身上的乏倒解了些，后院里的人情也跟着暖了一分。"},{"id":"c_check_store","label":"盘一遍杂货","timeCost":2,"effects":[{"kind":"resource","resourceId":"stock","delta":2},{"kind":"resource","resourceId":"stamina","delta":-2}],"text":"你卷起袖子，把墙角那几只杂货包一一拆开。吕秀才拿着小本子在旁边记，李大嘴蹲在地上挑挑拣拣，嚷道：‘这包干木耳还能用，那包粉条也没受潮！’郭芙蓉把翻出来的东西归拢到一处。你直起腰时觉得腰眼发酸，可手边多了两样能下锅的存货，账上也记得明白。"}]},{"id":"r3_market_restock","title":"长街补货","kind":"repeat","locationIds":["loc_street"],"repeat":{"cooldownTurns":2},"textVariants":["长街刚过晌午，菜担子摆了一溜。李大嘴蹲在一筐青萝卜前翻捡，嘴里念叨：“掌柜的，这萝卜脆生生，炖肉最出味，就是整筐买才便宜。”旁边卖干货的老周搓着手：“同福要得多，我今儿价钱好说。”白展堂从人堆里挤过来，低声道：“对门钱掌柜刚扫了半条街的货，剩下的可不经挑。”郭芙蓉两手叉腰：“怕他个啥，咱又不是没银子。”吕秀才却抱着账本直咽唾沫：“掌柜的，账上现银可不多……”","鱼摊老板把木盆往前一推，水花溅到鞋面：“活鱼就这几条，过了晌午就蔫，价还得往上走。”李大嘴眼睛发亮，又回头看佟湘玉脸色。白展堂把手中抹布一甩，替她拨开看热闹的闲人：“让让，让让，同福掌柜看货呢。”卖菜婆子拉住郭芙蓉袖子：“姑娘，你家掌柜最会算，赊一回账成不成？下回一并还。”吕秀才忙翻账页，小声提醒：“赊账人情要记牢，可不能糊涂。”"],"choices":[{"id":"c_bulk_buy","label":"大批买","timeCost":2,"requires":[{"kind":"resource","resourceId":"silver","atLeast":12}],"effects":[{"kind":"resource","resourceId":"silver","delta":-12},{"kind":"resource","resourceId":"stock","delta":10}],"text":"佟湘玉拍板，十二两银子整筐整担地买，萝卜、活鱼、干货一趟搬回后厨。李大嘴眉开眼笑，当即把鱼养进后厨水盆，连说明日招牌菜有了着落。白展堂和郭芙蓉来回跑了两趟，肩头扛得发红。吕秀才把银数一笔笔记清，只是看着钱匣空了半截，忍不住叹气。厨房里堆得满当，至少几日不用为食材发愁。"},{"id":"c_small_buy","label":"少买点","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":6}],"effects":[{"kind":"resource","resourceId":"silver","delta":-6},{"kind":"resource","resourceId":"stock","delta":4}],"text":"佟湘玉只点了六两银子的货，青萝卜一兜、干货两包，活鱼末了没舍得添。李大嘴撇撇嘴：“就这点，够谁吃啊？”白展堂把菜担往厨房挪，笑劝道：“细水长流嘛。”郭芙蓉把筐码齐，虽嫌少也没多话。吕秀才明显松了口气，账上还有余钱周转。这点库存撑不了太久，银钱却压得稳妥。"},{"id":"c_haggle_buy","label":"刷脸赊一点","timeCost":2,"requires":[{"kind":"resource","resourceId":"favor","atLeast":25}],"effects":[{"kind":"resource","resourceId":"silver","delta":-4},{"kind":"resource","resourceId":"stock","delta":5},{"kind":"resource","resourceId":"favor","delta":-2}],"text":"佟湘玉笑着跟老周算交情：“熟门熟路，少算些，往后都从你这儿走。”老周本想摇头，架不住卖菜婆子也帮腔，最后只收四两，添了五份货。人情是刷了，可老周末了嘀咕一句：“下回可没这么便宜了。”李大嘴倒不管这些，抱着萝卜就走。白展堂瞧出点门道，低声说：“掌柜的，面子使一回少一回。”"}]},{"id":"r4_chat_bai","title":"白展堂的街面消息","kind":"repeat","locationIds":["loc_hall"],"repeat":{"cooldownTurns":2},"textVariants":["白展堂把抹布往肩上一搭，凑到柜台前压低声音：“掌柜的，我今儿在街口听了一耳朵——东头卖布的赵家娘子问咱家还有没有空房，西街的胡屠户念叨咱的酱肉，说对门钱掌柜那边价压得狠。”他顿了顿，眼睛瞟向钱匣，“这些老客要是肯回头，咱这几天流水就有底了。”语气轻快，手指却在柜沿一下一下敲着。","白展堂擦完最后一张桌子，把抹布往水盆里一丢，凑过来：“掌柜的，昨儿我去送外卖，顺道打听了下。”他左右看一眼，声音更低，“钱掌柜那边好像托人放话，说咱家菜贵了，把几个熟客往他那边引。”说完又赶紧摆手，“我就是听着，没敢多问，官面上的事我可不想沾。”他搓着手，眼神时不时往柜上那串铜钱飘。"],"choices":[{"id":"c_bai_contacts","label":"问熟客","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"stamina","delta":-1}],"text":"你顺着白展堂的话细问，他报出几家老客的名头，连住处和口味都记得清楚。你拿笔在账本边角记下来，心里有了数。他见你认真听他说话，干活的步子都轻快几分，擦桌子顺带把门口迎客的板凳也摆正了。这一通问话耗了几分精神，人情却落在实处。"},{"id":"c_bai_bonus","label":"先给点工钱","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":5}],"effects":[{"kind":"resource","resourceId":"silver","delta":-5},{"kind":"resource","resourceId":"favor","delta":4}],"text":"你从钱匣里数出些散碎银钱，推到白展堂手边。他先一愣，随即憨笑，把银子揣好，抹布甩得比刚才起劲。“掌柜的放心，街面上的话，我保准给您打听真切！”他跑堂的嗓子亮了一截，招呼客人都热络起来，只是账上那几文钱实实在在少了。"},{"id":"c_bai_gossip","label":"聊两句闲话","timeCost":1,"effects":[{"kind":"resource","resourceId":"reputation","delta":1},{"kind":"resource","resourceId":"favor","delta":-1}],"text":"你干脆靠在柜台边，跟白展堂闲聊起来。他讲钱掌柜新买的扇子、邢捕头昨儿犯了腰，又扯到对门伙计说漏嘴的话。听着热闹，有用的却不多，倒叫门口新来的客人等了一阵。白展堂说得尽兴，手上抹布差点忘了泡进盆里。闲话解乏，正经工夫却耽搁了。"}]},{"id":"r5_chat_guo","title":"郭芙蓉要搭手","kind":"repeat","locationIds":["loc_backyard"],"repeat":{"cooldownTurns":2},"textVariants":["郭芙蓉端着一盆水从后院过来，袖子挽得老高，水珠溅了一路。她把盆往地上一搁，叉腰道：“掌柜的，我看你这两天算盘打得噼啪响，账本都快翻烂了，我闲得手脚发痒——你倒是给我派个正经活儿啊！”白展堂从二楼探出脑袋：“芙妹，你把那盆水先端稳了再说。”郭芙蓉回头瞪他一眼：“你少管！”又转回来盯着佟湘玉，眼里全是等着被点名的热乎劲。后院晾着的床单被风吹得鼓起来，灶房飘出李大嘴试菜的油烟味。","佟湘玉刚把昨日的流水理出个头绪，郭芙蓉就风风火火冲进后院，差点撞翻墙角的腌菜坛子。“掌柜的，我听说对门钱掌柜又压价了？这事儿你交给我，我这就去把他家招牌——”她比了个劈掌的手势，自己先乐了。白展堂在后头咳了一声：“掌柜的，她这是真闲得慌。”郭芙蓉不服气地挺直腰板，把手掌摊开：“你摸摸，我手心都起茧了，全是干活干的，可干的都是没名没分的杂活儿。”"],"choices":[{"id":"c_guo_teach","label":"教她算账","timeCost":1,"effects":[{"kind":"resource","resourceId":"stamina","delta":-2},{"kind":"resource","resourceId":"favor","delta":3}],"text":"佟湘玉把账本往郭芙蓉面前一推，让她先把今日的菜钱加一遍。郭芙蓉撸起袖子，一笔一笔写得认真，算盘珠子拨得叮当响，可加到第三遍还是把三两五钱算成了五两三钱。佟湘玉叹气，握着她的手又教了一回，郭芙蓉挠头憨笑：“下回准行！”虽没算对，但她端端正正把错处圈出来，倒了碗热茶搁在佟湘玉手边。"},{"id":"c_guo_errand","label":"派她跑腿","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":2}],"effects":[{"kind":"resource","resourceId":"silver","delta":-2},{"kind":"resource","resourceId":"favor","delta":2}],"text":"郭芙蓉接过二两碎银，揣进怀里就跑，跑两步又回来问：“掌柜的，葱要粗的还是细的？豆腐要老还是嫩？”佟湘玉一一交代，她点头如捣蒜，一阵风似的没了影。半个时辰后她扛回半扇排骨，还顺带捎来街口王婆的话：后日有队行商要路过。她抹着汗把找零一文不少拍在柜上，得意地扬了扬下巴。"},{"id":"c_guo_praise","label":"夸她两句","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":1},{"kind":"resource","resourceId":"reputation","delta":1}],"text":"佟湘玉夸她手脚麻利、眼里有活，郭芙蓉先是一愣，随后笑得嘴角快咧到耳根，搓着手说：“掌柜的你可算说了句公道话！”她主动把后院那堆碗碟全洗了，又跑前跑后把客房被褥拍得蓬松。白展堂在旁嘀咕：“这一夸，顶十两工钱。”郭芙蓉听见了也不恼，反而更来劲，连廊下的灯笼都擦亮了。"}]},{"id":"r6_chat_lv","title":"吕秀才的账本","kind":"repeat","locationIds":["loc_accounts"],"repeat":{"cooldownTurns":2},"textVariants":["账房里算盘珠子噼啪响，吕秀才趴在桌上，一笔一笔往红纸上对，脑门上见了汗。“掌柜的，您瞧这笔，”他抬起头，把账本往佟湘玉那边推了推，声音发虚，“前日进的菜钱和卖出去的流水，总差着几十文，我核了三遍，越核越心慌。”楼下李大嘴正吆喝新熬的骨汤，郭芙蓉扛着抹布从门口过，探头嚷一句“秀才你脸都白了”。佟湘玉得拿个主意：是让他再细细核一笔，还是支使出去写几张招贴，又或者干脆先听他倒倒苦水。","日头偏西，账房窗台上多了半盏凉茶。吕秀才捏着笔杆子，忽然冒出一句：“掌柜的，咱们客栈若有副对子挂在门楣上，读书人路过也愿进来看一眼。”他眼睛亮起来，又很快蔫下去，“只是这墨与纸得要钱，写出来酸不酸，我也不晓得。”楼下白展堂正招呼客人，顺嘴喊了句“秀才又琢磨歪点子了”。佟湘玉站在柜台后头，手里银子掂了又掂，听他把话说完再作打算。"],"choices":[{"id":"c_lv_audit_tip","label":"让他核一笔","timeCost":2,"requires":[{"kind":"resource","resourceId":"favor","atLeast":30},{"kind":"resource","resourceId":"silver","atLeast":2}],"effects":[{"kind":"resource","resourceId":"silver","delta":-2},{"kind":"set","factId":"f_ledger_balanced","value":true}],"text":"佟湘玉拍板，让吕秀才再核一遍。秀才咽了口茶，把前日菜钱、当日流水一笔笔对，连茶碗磕桌的声响都停了。半晌他长出一口气，红笔一勾：“对上了，掌柜的，是那笔骨汤钱记岔了行。”账本总算轧平，佟湘玉心里一块石头落地，可桌上少了些散碎银钱，也耗去不少工夫。吕秀才把记录规规矩矩摞好，人还微微发抖，却挺了挺腰。"},{"id":"c_lv_poem_ad","label":"写招贴","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":3}],"effects":[{"kind":"resource","resourceId":"silver","delta":-3},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉叫吕秀才写招贴。秀才知道这是给同福客栈挣脸面，研墨时手都不抖了。他写下“一饭之恩，半日之暖”，又添一行小字“骨汤现熬，客房干净”。墨迹未干，白展堂就揭了一张贴到门外，嘴上嫌酸，却念得比谁都响。路过两个挑担子的客人驻足看了半晌，真进门问价。纸张墨钱花了些，客栈门前的名头倒比往常响亮亮了几分。"},{"id":"c_lv_listen","label":"听他诉苦","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":2},{"kind":"resource","resourceId":"stamina","delta":-1}],"text":"佟湘玉没催他核账，反把椅子一拉，坐下听吕秀才念叨。秀才说怕自己算错连累客栈，又说对门钱掌柜背地里不知怎么看笑话。佟湘玉听他絮絮说完，拍拍账本：“有事慢慢说，账是一笔笔理的，人也是一句句听的。”秀才眼圈一热，把账本往怀里一抱。楼下郭芙蓉喊晌午的菜不够了，他应得比往常利索，跑得也快，像是心里卸下块石头。"}]},{"id":"r7_chat_li","title":"李大嘴的灶边话","kind":"repeat","locationIds":["loc_kitchen"],"repeat":{"cooldownTurns":2},"textVariants":["后厨的窗户半开着，油烟和隔壁院子里晾的咸菜味儿混在一块儿。李大嘴围着那条洗得发白的围裙，正对着一锅咕嘟冒泡的汤发愣。听见脚步声，他扭过脸来，眼睛一亮：“掌柜的！你来正好，这锅汤我刚换了三回料，就缺个懂行的舌头。”灶台边上堆着半筐蔫了的青菜，案板上还沾着没擦净的面粉。白展堂从门口探进半个脑袋，说前头有两桌客催菜了。李大嘴一挥手：“去去去，别耽误掌柜的品菜。”可那锅汤的香气里，隐隐夹着一丝焦糊味儿。","午后灶火刚歇，李大嘴坐在小马扎上，拿围裙角擦他那把惯用的炒勺。见佟湘玉进来，他赶紧站起来，又坐下，搓搓手：“掌柜的，郭芙蓉昨儿个说我做菜‘全凭运气’，这话我不爱听。”他顿了顿，压低声儿，“我琢磨着，光靠这些家常菜，留不住回头客。我这私房菜谱里，还有几道压箱底的……”话没说完，莫小贝从面缸后头冒出来，伸手就要够灶台上的糖罐。李大嘴一把拦住她：“哎哟小祖宗，那是我称好了要用的！”"],"choices":[{"id":"c_li_taste","label":"尝一口新菜","timeCost":1,"requires":[{"kind":"resource","resourceId":"stock","atLeast":1}],"effects":[{"kind":"resource","resourceId":"stock","delta":-1},{"kind":"resource","resourceId":"stamina","delta":1},{"kind":"resource","resourceId":"favor","delta":2}],"text":"佟湘玉舀了一勺汤，吹了吹送进嘴里。咸淡倒还说得过去，就是后味儿带点糊。李大嘴眼巴巴地盯着她：“咋样？我今儿个这火候可掐得准。”她点点头，又摇摇头：“准是准，就是锅底该刷了。”李大嘴挠着后脑勺嘿嘿一笑，赶紧把汤盛出一碗递给外头的客人。你少了一小份存货，倒是站着歇了歇脚，灶房里多了几分热乎气儿。"},{"id":"c_li_buy_ingredient","label":"给他买料","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":4}],"effects":[{"kind":"resource","resourceId":"silver","delta":-4},{"kind":"resource","resourceId":"stock","delta":3}],"text":"佟湘玉从钱袋里数出四两银子拍在案板上：“去，把缺的料补齐，挑新鲜的，别又让人糊弄。”李大嘴眉开眼笑地揣起银子，边往外跑边回头喊：“掌柜的放心，我李大嘴买菜，一根葱都能掐出水来！”不多时，他挎着满满一篮子回来，有肉有菜，还搭了把嫩葱。你搭进去四两银子，厨房的库存眼见着厚实了三分。"},{"id":"c_li_recipe_talk","label":"聊菜谱","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":1},{"kind":"set","factId":"f_secret_recipe_known","value":true}],"text":"李大嘴来了劲，把炒勺往灶台上一搁，掰着手指头给你数：“先是那道三鲜汤，得用老母鸡吊底；还有那红烧狮子头，肉得自己剁，机器绞的可不成……”他说得唾沫横飞，你听得半信半疑，却也听出他确实是下了功夫琢磨的。灶边闲聊的工夫，他对掌柜的亲近又添了一分。至于那菜谱到底藏着多少真东西，还得往后瞧。"}]},{"id":"r8_clean_hall","title":"正厅收拾","kind":"repeat","locationIds":["loc_hall"],"repeat":{"cooldownTurns":1},"textVariants":["晌午刚过，正厅里三张桌子还堆着早饭的碗碟，油花在桌面上凝成一层薄亮。白展堂拎着抹布从后头探出脑袋：“掌柜的，这桌子再不擦，客人进来都没处下筷子。”郭芙蓉在门口把凳子摞得哐哐响，嘴里嘟囔：“我说我来收拾，展堂哥偏说我擦不干净。”吕秀才抱着账本从柜台后绕出来，一脚踩到地上的半块馍，哎哟一声扶住桌角。李大嘴从厨房探头，手里还攥着锅铲，嚷嚷着灶上腾不出人手。门外已有客人的脚步声，正厅的体面就摆在这一刻。","未时刚过，正厅里两张方桌油光可鉴，筷子横七竖八压在碗沿上，板凳也歪着。郭芙蓉拿笤帚扫了一圈，故意把簸箕顿在佟湘玉脚边：“掌柜的，我扫完地了，桌子可没归我管。”白展堂把一条抹布搭在肩上，笑嘻嘻地讨价：“这收拾正厅的活，得算一份跑堂的辛苦钱吧？”吕秀才小声劝：“后头还有账没对，正厅不收拾，客人一进门就瞧见脏碗，名声传出去可不好听。”门口风一吹，卷起几片花生皮。"],"choices":[{"id":"c_clean_self","label":"亲自收拾","timeCost":2,"effects":[{"kind":"resource","resourceId":"stamina","delta":-4},{"kind":"resource","resourceId":"reputation","delta":2}],"text":"佟湘玉挽起袖子，把碗碟一只只端进后厨，抹布拧了三回，桌面擦得能照见人影。客人进门时瞧见掌柜亲自忙活，都笑着点头。郭芙蓉在旁学样，帮着把凳子摆正。到晚间打烊，佟湘玉捶着胳膊，脸上却是笑：“省下三文钱，挣回三分脸。”正厅亮堂了，她自己也累得直不起腰。"},{"id":"c_clean_hire","label":"花钱请人","timeCost":1,"requires":[{"kind":"resource","resourceId":"silver","atLeast":3}],"effects":[{"kind":"resource","resourceId":"silver","delta":-3},{"kind":"resource","resourceId":"reputation","delta":3},{"kind":"resource","resourceId":"favor","delta":1}],"text":"佟湘玉从钱袋里数出三文，叫来街口闲着的短工。那人手脚麻利，一个时辰不到，碗碟归柜，桌面擦净，连墙角积的灰都扫了。客人进门赞一声“同福到底是同福”，郭芙蓉虽嘟囔了几句，伙计们见厅堂亮堂也松快。夜里清账，银钱少了三文，正厅的体面却多添了几分。"},{"id":"c_clean_ignore","label":"先不收拾","timeCost":1,"effects":[{"kind":"resource","resourceId":"favor","delta":-1},{"kind":"resource","resourceId":"reputation","delta":-1},{"kind":"resource","resourceId":"stamina","delta":1}],"text":"佟湘玉摆摆手：“先放着，后头账要紧。”碗碟便一直堆在桌上，伙计们绕道走，郭芙蓉干脆把簸箕一撂。傍晚来了两桌客人，进门先皱眉，指着脏碗问：“同福这是改卖剩饭了？”白展堂赔笑道歉，拉客人去了角落。佟湘玉面上挂不住，伙计们也觉得掌柜不当回事，正厅的冷清一直拖到掌灯。"}]}],"provenance":{"generator":"llm","model":"deepseek-flash","source":"runner"}},"createdAt":"2026-11-03T10:43:31.203Z"},"catalogSnapshot":{"buildingLibrary":{"schemaVersion":1,"assets":[]},"itemCatalog":{"schemaVersion":1,"items":[]}}}</script><script type="application/octet-stream" id="btg-code">H4sIAAAAAAACA+y9aXfbxrYg+v3+CiovrQauSgypwQNpRNfWEDuxLUdyBkdRCxBZFBGTAAOAkmWJ57e/PdQIgopzzrm9utfqrFhEzdOuXbv2VNdJ0ZLR8eUfclC1B4VMKikqHR7KUZrJd0U+k0V1KzIdfyWr45tMxx/IclCksyovRNGc420ylaVInURIqfLqdiaPRyLR8TMd2R4npVNc5FEAvRJZGH0bwL+7dBRkYTUu8ptWdtY571fF7V0hq3mRteT6elBFMpBRJwxFtRgk1WAcyPBOZY/O5LmQi4UoqU5VY1Dd3wcygJJ38tMsL6qyd7dYhG0VgHxCRtl8MoEqdWQoBlgFdupuIqtWEd0t+qO8CK5hStNWCn0Jq6AQqbiDAffkWQoNZ/OpLJLLieytdRZhX3U6u7/HnKe308t80q7y06pIs6v3yZW4u04mc9mL3+TD+UTGi1AUCzHBdlORi1JNRrq+jtOWj1ppFMU5zWYMddq40TwbVGmexaHu4SAqgjSEujpiHg3aE5ldVWMx7E+ezfuTjY1wGA3OJudiLWkPkskEGhyG6+vDtSjKoTEM8rBgor9NYU7D9mWaDQOcI8jpDTQooyxIITa8vy/bNsWOXy6gD0EmCpHjYuRRFtFs790tejJIYbGho0Fxf7+W4b/2xYUseUYgqDqYiRjANZlPqjjcq4LcBvUkZvXp
